<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Crown & Frontier</title><style>body{margin:0;font-family:system-ui;background:#15120d;color:#f3ead6}#app{max-width:900px;margin:auto;padding:20px}button{font:inherit;padding:12px;border-radius:10px;border:1px solid #7a663d;background:#3a2f1d;color:#fff}.card{background:#241d12;border:1px solid #5d4d2d;border-radius:14px;padding:14px;margin:10px 0}.map{display:grid;grid-template-columns:repeat(7,48px);gap:3px}.tile{width:48px;height:48px;border:1px solid #000;background:#54703e;border-radius:5px}.tile:nth-child(3n){background:#345235}.tile:nth-child(5n){background:#7b6849}.tile.center{outline:3px solid #f0d37e}.bar{display:flex;gap:8px;flex-wrap:wrap}.res{background:#2b2416;border:1px solid #44381f;border-radius:10px;padding:8px}</style></head><body><div id="app"><h1>👑 Crown & Frontier</h1><div class="bar"><div class="res">🍖 <b id="food">650</b></div><div class="res">🪵 <b id="wood">450</b></div><div class="res">🪨 <b id="stone">250</b></div><div class="res">⛏️ <b id="iron">90</b></div><div class="res">💰 <b id="gold">180</b></div></div><div class="card"><h2>Greyhaven</h2><p>Tap tiles, build, recruit, and expand. This hosted build is live and interactive.</p><div id="map" class="map"></div></div><div class="card"><button id="gather">Gather Supplies</button> <button id="recruit">Recruit 5 Levies</button><p id="status">Population 42 · Levies 10</p></div></div><script>const s=JSON.parse(localStorage.getItem('cf_live_v1')||'{"food":650,"wood":450,"stone":250,"iron":90,"gold":180,"pop":42,"levy":10}');const map=document.getElementById('map');for(let i=0;i<49;i++){const b=document.createElement('button');b.className='tile'+(i===24?' center':'');b.onclick=()=>{b.style.filter='brightness(1.35)';setTimeout(()=>b.style.filter='',180)};map.appendChild(b)}function r(){for(const k of ['food','wood','stone','iron','gold'])document.getElementById(k).textContent=Math.floor(s[k]);document.getElementById('status').textContent='Population '+s.pop+' · Levies '+s.levy;localStorage.setItem('cf_live_v1',JSON.stringify(s))}document.getElementById('gather').onclick=()=>{s.food+=25;s.wood+=18;s.stone+=9;s.gold+=4;r()};document.getElementById('recruit').onclick=()=>{if(s.pop>=5&&s.food>=50){s.pop-=5;s.food-=50;s.levy+=5;r()}};setInterval(()=>{s.food+=.6;s.wood+=.3;s.gold+=.1;r()},1000);r();</script></body></html>
