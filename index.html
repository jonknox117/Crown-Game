<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#17130d"><title>Crown & Frontier</title><style>:root{--bg:#15120d;--panel:#241d12;--line:#5d4d2d;--text:#f4ecd8;--muted:#b9ac8c;--gold:#e4c968;--good:#79b565;--bad:#d37668}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:linear-gradient(#17130d,#0e0c08);color:var(--text);font-family:system-ui,-apple-system,sans-serif;overflow:hidden}button,select{font:inherit;color:inherit}button{cursor:pointer}#app{height:100dvh;display:flex;flex-direction:column;max-width:900px;margin:auto}header{padding:max(10px,env(safe-area-inset-top)) 10px 8px;background:#1c170f;border-bottom:1px solid var(--line);z-index:5}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-weight:900;letter-spacing:.04em}.muted{color:var(--muted);font-size:12px}.resbar{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:8px}.res{background:#2a2215;border:1px solid #44381f;border-radius:10px;text-align:center;padding:6px 2px;font-size:11px}.res b{display:block;font-size:12px}.gain{color:#8fc47a;font-size:9px}main{flex:1;min-height:0;overflow:auto;padding:10px 10px 90px}.view{display:none}.view.active{display:block}.card{background:linear-gradient(180deg,#271f13,#1d180f);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 10px 25px #0005}.card h2,.card h3{margin:0 0 8px}.btn{background:#3a2f1d;border:1px solid #7b673d;border-radius:10px;padding:9px 11px;font-weight:800}.btn:active{transform:scale(.96)}.btn.primary{background:#6c5930}.btn.good{background:#36552f}.btn.bad{background:#5c3028}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.info{width:30px;height:30px;border-radius:50%;padding:0;border:1px solid #8a7547;background:#302718;font-weight:900}.mapwrap{height:min(57vh,540px);overflow:auto;border:1px solid var(--line);border-radius:14px;background:#090806}.map{display:grid;grid-template-columns:repeat(13,54px);grid-template-rows:repeat(13,54px);width:max-content;padding:4px;position:relative}.tile{width:54px;height:54px;border:1px solid #0006;padding:0;position:relative;overflow:hidden;background:#637b42}.tile::after{content:'';position:absolute;inset:0;background:linear-gradient(140deg,#fff2,transparent 40%,#0002);pointer-events:none}.tile.plains{background:linear-gradient(#708b45,#526735)}.tile.forest{background:linear-gradient(#3d5c34,#274426)}.tile.hills{background:linear-gradient(#89744e,#655238)}.tile.mountain{background:linear-gradient(#767a7d,#505558)}.tile.water{background:linear-gradient(#4d8cb7,#2d5f80)}.tile.water::before{content:'';position:absolute;inset:-20%;background:repeating-linear-gradient(0deg,transparent 0 8px,#d5f1ff2b 9px 10px);animation:water 3s linear infinite}.tile.ruins{background:linear-gradient(#70685a,#50463b)}.tile.mineTerrain{background:linear-gradient(#776c60,#574b40)}.tile.fog{filter:brightness(.32) saturate(.4)}.tile.mine{outline:2px solid #e3c65f}.tile.red{outline:2px solid #b34d41}.tile.blue{outline:2px solid #4d78ad}.tile.green{outline:2px solid #559052}.tile.purple{outline:2px solid #925fb2}.tile.sel{box-shadow:inset 0 0 0 3px #fff,0 0 16px #ffe77caa;z-index:3;animation:pulse 1.5s ease-in-out infinite}.terrain{position:absolute;left:3px;top:2px;font-size:14px;opacity:.9}.sprite{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:29px;filter:drop-shadow(0 3px 2px #0008);animation:bob 2.8s ease-in-out infinite;z-index:2}.owner{position:absolute;right:3px;top:3px;width:7px;height:7px;border-radius:50%;background:#f0d875;box-shadow:0 0 5px #000}.armyDot{position:absolute;left:2px;bottom:2px;background:#15110dcc;border:1px solid #8b7749;border-radius:7px;padding:0 3px;font-size:10px;z-index:3}.marcher{position:absolute;font-size:28px;z-index:8;pointer-events:none;filter:drop-shadow(0 4px 3px #000);animation:march .6s alternate infinite}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{background:#2b2316;border:1px solid #4f4228;border-radius:11px;padding:9px}.itemHead{display:flex;justify-content:space-between;align-items:center;gap:6px}.item .emoji{font-size:26px}.cost{color:#ddcfa9;font-size:11px;margin:4px 0}.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #40351f;font-size:13px}.stat:last-child{border:0}.badge{font-size:11px;border:1px solid #665635;background:#332a19;border-radius:999px;padding:3px 7px}.log{padding:7px 0;border-bottom:1px solid #3d321d;font-size:12px}nav{position:fixed;bottom:0;left:0;right:0;max-width:900px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:#17130df2;border-top:1px solid var(--line);backdrop-filter:blur(12px);z-index:10}.nav{border:0;background:none;color:#9f9071;padding:3px;font-size:10px}.nav b{display:block;font-size:20px}.nav.active{color:#f1d577}.overlay{position:fixed;inset:0;background:#080604e8;display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}.overlay.hidden,.hidden{display:none!important}.modal{width:min(520px,100%);max-height:82vh;overflow:auto;background:#251e12;border:1px solid #6e5d38;border-radius:16px;padding:16px}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#f1e4c5;color:#201a11;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:900;z-index:50;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}.fx{position:fixed;left:50%;top:50%;z-index:60;font-weight:1000;font-size:23px;text-shadow:0 2px 5px #000;pointer-events:none;animation:burst .8s forwards}select{width:100%;background:#17120c;border:1px solid #5c4d2d;border-radius:9px;padding:9px}@keyframes water{to{transform:translateY(18px)}}@keyframes pulse{50%{filter:brightness(1.18)}}@keyframes bob{50%{transform:translate(-50%,-56%)}}@keyframes march{to{transform:translateY(-4px) rotate(2deg)}}@keyframes burst{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-90px) scale(1.25)}}@media(min-width:700px){.map{grid-template-columns:repeat(13,60px);grid-template-rows:repeat(13,60px)}.tile{width:60px;height:60px}}</style></head><body><div id="app"><header><div class="top"><div class="brand">👑 CROWN & FRONTIER</div><div class="muted" id="season">Year 1 · Spring</div></div><div id="resbar" class="resbar"></div></header><main><section id="mapView" class="view active"><div class="card"><div class="top"><div><b>Greyhaven</b><div class="muted" id="summary"></div></div><div class="row"><button class="info" data-help="game">i</button><button class="btn" id="center">⌖</button></div></div></div><div class="mapwrap" id="mapwrap"><div id="map" class="map"></div></div><div id="tilePanel" class="card"></div></section><section id="kingdomView" class="view"><div class="card"><h2>Kingdom</h2><div id="stats"></div></div><div class="card"><h3>Build on selected tile</h3><div class="muted">Select empty land you own on the map first.</div><div id="builds" class="grid2" style="margin-top:8px"></div></div></section><section id="armiesView" class="view"><div class="card"><h2>Recruit</h2><div id="units" class="grid2"></div></div><div class="card"><h2>Field Armies</h2><div id="armyList"></div><button class="btn primary" id="formArmy">Form Field Army</button></div></section><section id="dipView" class="view"><div class="card"><h2>Neighboring Powers</h2><div id="factions"></div></div></section><section id="logView" class="view"><div class="card"><h2>Chronicle</h2><div id="logs"></div></div><div class="card"><button class="btn bad" id="reset">Reset Kingdom</button></div></section></main><nav><button class="nav active" data-v="map"><b>🗺️</b>Map</button><button class="nav" data-v="kingdom"><b>🏰</b>Kingdom</button><button class="nav" data-v="armies"><b>⚔️</b>Armies</button><button class="nav" data-v="dip"><b>🤝</b>Diplomacy</button><button class="nav" data-v="log"><b>📜</b>Chronicle</button></nav></div><div id="overlay" class="overlay hidden"><div class="modal"><div class="top"><h2 id="modalTitle">Info</h2><button class="info" id="close">×</button></div><div id="modalBody"></div></div></div><div id="toast" class="toast hidden"></div><script>(()=>{'use strict';const KEY='crown_frontier_hosted_v4',W=13,H=13,R=['food','wood','stone','iron','gold'],RI={food:'🍖',wood:'🪵',stone:'🪨',iron:'⛏️',gold:'💰'},T={plains:['Plains','🌾'],forest:['Forest','🌲'],hills:['Hills','🪨'],mountain:['Mountains','⛰️'],water:['River','🌊'],ruins:['Ruins','🏚️'],mineTerrain:['Mine','🕳️']},B={farm:{n:'Farm',e:'🌾',c:{wood:45,stone:10},r:{food:.25},d:'Produces food. +60% on plains.'},lumber:{n:'Logging Camp',e:'🪓',c:{wood:25,stone:10},r:{wood:.19},d:'Produces wood. +80% in forests.'},quarry:{n:'Quarry',e:'🪨',c:{wood:30,stone:15},r:{stone:.14},d:'Produces stone. +80% on hills.'},mine:{n:'Iron Mine',e:'⛏️',c:{wood:55,stone:35,gold:15},r:{iron:.085},d:'Produces iron. Best on hills and mountains.'},house:{n:'Homes',e:'🏠',c:{wood:55,stone:25},r:{},d:'Adds 30 population capacity.'},barracks:{n:'Barracks',e:'🛡️',c:{wood:75,stone:50,iron:16},r:{},d:'Strengthens defense and supports armies.'},market:{n:'Market',e:'🏪',c:{wood:70,stone:35,gold:45},r:{gold:.075},d:'Produces gold.'},watch:{n:'Watchtower',e:'🗼',c:{wood:50,stone:55},r:{},d:'Reveals a large area of the map.'},road:{n:'Road',e:'🛣️',c:{stone:20,wood:10},r:{},d:'Armies entering this tile travel faster.'},fort:{n:'Fort',e:'🏯',c:{wood:110,stone:135,iron:40,gold:35},r:{},d:'Major local defense bonus.'}},U={levy:{n:'Levy',e:'🧑‍🌾',p:1,c:{food:14,gold:4},d:'Cheap emergency infantry.'},spear:{n:'Spearmen',e:'🗡️',p:1.9,c:{food:20,wood:6,iron:5,gold:8},d:'Reliable line infantry.'},archer:{n:'Archers',e:'🏹',p:2.2,c:{food:22,wood:11,iron:3,gold:10},d:'Efficient ranged support.'},guard:{n:'Men-at-Arms',e:'🛡️',p:3.3,c:{food:30,iron:14,gold:18},d:'Heavy professional infantry.'},cavalry:{n:'Cavalry',e:'🐎',p:4.2,c:{food:42,iron:11,gold:30},d:'Elite troops that speed army travel.'}},AI=[['red','Redwater','🟥',.78],['blue','Velm League','🟦',.2],['green','House Thorn','🟩',.42],['purple','Ash Tribes','🟪',.68]];let S,sel={x:6,y:6},last=Date.now(),aiTimer=0,saveTimer=0;const idx=(x,y)=>y*W+x,tile=(x,y)=>x>=0&&y>=0&&x<W&&y<H?S.map[idx(x,y)]:null,nei=(x,y)=>[[x+1,y],[x-1,y],[x,y+1],[x,y-1]].filter(([a,b])=>a>=0&&b>=0&&a<W&&b<H),rnd=n=>{let x=Math.sin(n*999+n*n*.17)*10000;return x-Math.floor(x)};function reveal(m,x,y,r){for(let yy=y-r;yy<=y+r;yy++)for(let xx=x-r;xx<=x+r;xx++)if(xx>=0&&yy>=0&&xx<W&&yy<H)m[idx(xx,yy)].vis=1}function mkMap(seed){let m=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++){let q=rnd(seed+x*17+y*31),t=q<.08?'water':q<.3?'forest':q<.43?'hills':q<.5?'mountain':'plains';if(rnd(seed*2+x*11+y*43)>.965&&t!='water')t='ruins';m.push({x,y,t,o:null,b:null,vis:0})}let c=m[idx(6,6)];Object.assign(c,{t:'plains',o:'me',b:'castle'});[[5,6,'farm'],[7,6,'lumber'],[6,5,null],[6,7,null]].forEach(([x,y,b])=>Object.assign(m[idx(x,y)],{o:'me',b}));let sp={red:[1,1],blue:[11,1],green:[1,11],purple:[11,11]};for(const id in sp){let [x,y]=sp[id];Object.assign(m[idx(x,y)],{o:id,b:'castle',t:'plains'});nei(x,y).slice(0,2).forEach(([a,b])=>{if(m[idx(a,b)].t!='water')m[idx(a,b)].o=id})}reveal(m,6,6,2);return m}function fresh(){let seed=Math.floor(Math.random()*999999);return{v:4,seed,res:{food:650,wood:450,stone:250,iron:90,gold:180},pop:42,happy:72,g:{levy:10,spear:6,archer:2,guard:0,cavalry:0},armies:[],next:1,map:mkMap(seed),ai:AI.map(([id,n,e,a])=>({id,n,e,a,p:70+Math.random()*60,rel:0})),clock:0,logs:[{t:Date.now(),m:'Greyhaven was founded.'}],last:Date.now()}}function save(){try{S.last=Date.now();localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.v===4){S=x;let dt=Math.min(28800,(Date.now()-(S.last||Date.now()))/1000);step(dt,true);return}}catch(e){}S=fresh();save()}function owned(){return S.map.filter(t=>t.o==='me')}function countB(k){return owned().filter(t=>t.b===k).length}function cap(){return 40+countB('house')*30+countB('castle')*30}function troops(){let n=Object.values(S.g).reduce((a,b)=>a+b,0);S.armies.forEach(a=>n+=Object.values(a.u).reduce((x,y)=>x+y,0));return n}function rates(){let z={food:.06,wood:.035,stone:.018,iron:.008,gold:.012};owned().forEach(t=>{let b=B[t.b];if(!b)return;for(const k in b.r){let m=1;if(t.b==='farm'&&t.t==='plains')m=1.6;if(t.b==='lumber'&&t.t==='forest')m=1.8;if(t.b==='quarry'&&t.t==='hills')m=1.8;if(t.b==='mine'&&['hills','mountain','mineTerrain'].includes(t.t))m=1.9;z[k]+=b.r[k]*m}});z.food-=S.pop*.0011+troops()*.0013;return z}function pay(c,m=1){if(!Object.keys(c).every(k=>S.res[k]>=c[k]*m))return false;for(const k in c)S.res[k]-=c[k]*m;return true}function cost(c,m=1){return Object.keys(c).map(k=>RI[k]+Math.ceil(c[k]*m)).join(' ')}function power(u){return Object.keys(u).reduce((n,k)=>n+(U[k]?.p||0)*(u[k]||0),0)}function log(m){S.logs.unshift({t:Date.now(),m});S.logs=S.logs.slice(0,80)}function toast(m){let e=document.getElementById('toast');e.textContent=m;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),1700)}function fx(m){let e=document.createElement('div');e.className='fx';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),850)}function info(title,html){modalTitle.textContent=title;modalBody.innerHTML=html;overlay.classList.remove('hidden')}function step(dt,offline=false){dt=Math.min(dt,offline?28800:5);let rr=rates();R.forEach(k=>S.res[k]=Math.max(0,S.res[k]+rr[k]*dt));S.clock+=dt;if(S.res.food>20&&S.pop<cap())S.pop=Math.min(cap(),S.pop+dt*.004);S.armies.forEach(a=>{if(a.st==='move'){a.left-=dt;let p=1-Math.max(0,a.left)/a.dur;a.rx=a.ox+(a.tx-a.ox)*p;a.ry=a.oy+(a.ty-a.oy)*p;if(a.left<=0)arrive(a)}});if(!offline){aiTimer+=dt;saveTimer+=dt;if(aiTimer>20){aiTimer=0;aiStep()}if(saveTimer>4){saveTimer=0;save()}}}function arrive(a){let t=tile(a.tx,a.ty);if(!t)return a.st='idle';if(!t.o||t.o==='me'){if(!t.o){t.o='me';reveal(S.map,t.x,t.y,1);log(a.n+' secured new territory.');fx('NEW LAND')}Object.assign(a,{x:t.x,y:t.y,rx:t.x,ry:t.y,st:'idle'});return renderAll()}let ai=S.ai.find(q=>q.id===t.o),atk=power(a.u)*(.9+Math.random()*.2),def=Math.max(10,ai.p/4)*(.85+Math.random()*.3)*(t.b==='castle'?1.7:t.b==='fort'?2:1);if(atk>def){for(const k in a.u)a.u[k]=Math.floor(a.u[k]*(.68+Math.random()*.16));t.o='me';ai.p=Math.max(5,ai.p-def*.35);Object.assign(a,{x:t.x,y:t.y,rx:t.x,ry:t.y,st:'idle'});reveal(S.map,t.x,t.y,1);log(a.n+' defeated '+ai.n+'.');fx('VICTORY')}else{for(const k in a.u)a.u[k]=Math.floor(a.u[k]*(.3+Math.random()*.2));ai.p=Math.max(5,ai.p-atk*.25);Object.assign(a,{x:a.ox,y:a.oy,rx:a.ox,ry:a.oy,st:'idle'});log(a.n+' was repelled by '+ai.n+'.');toast('Army repelled')}renderAll()}function aiStep(){let ai=S.ai[Math.floor(Math.random()*S.ai.length)],own=S.map.filter(t=>t.o===ai.id);ai.p+=1;if(!own.length)return;let bd=[];own.forEach(o=>nei(o.x,o.y).forEach(([x,y])=>{let n=tile(x,y);if(n.t!=='water'&&n.o!==ai.id)bd.push(n)}));if(!bd.length)return;let t=bd[Math.floor(Math.random()*bd.length)];if(!t.o&&Math.random()<.55){t.o=ai.id;if(t.vis)log(ai.n+' expanded.')}else if(t.o==='me'&&Math.random()<ai.a*.22){let def=12+(t.b==='fort'?45:t.b==='castle'?35:0);if(ai.p/4>def){t.o=ai.id;log(ai.n+' captured a border tile.');toast(ai.n+' attacked your border')}}}function season(){let s=['Spring','Summer','Autumn','Winter'],len=300;return'Year '+(Math.floor(S.clock/(len*4))+1)+' · '+s[Math.floor((S.clock%(len*4))/len)]}function renderRes(){let rr=rates();resbar.innerHTML=R.map(k=>'<div class="res"><b>'+RI[k]+' '+Math.floor(S.res[k])+'</b><span class="gain">'+(rr[k]>=0?'+':'')+(rr[k]*60).toFixed(1)+'/m</span></div>').join('')}function renderMap(){map.innerHTML='';S.map.forEach(t=>{let b=document.createElement('button'),own=t.o==='me'?'mine':t.o||'';b.className='tile '+t.t+' '+own+(t.vis?'':' fog')+(t.x===sel.x&&t.y===sel.y?' sel':'');let terr='<span class="terrain">'+T[t.t][1]+'</span>',spr='';if(t.b)spr='<span class="sprite">'+(t.b==='castle'?'🏰':B[t.b]?.e||'🏠')+'</span>';else if(t.t==='ruins')spr='<span class="sprite">🏚️</span>';let armies=S.armies.filter(a=>a.st==='idle'&&a.x===t.x&&a.y===t.y);b.innerHTML=terr+spr+(t.o==='me'&&!t.b?'<span class="owner"></span>':'')+(armies.length?'<span class="armyDot">⚔'+armies.length+'</span>':'');b.onclick=()=>{sel={x:t.x,y:t.y};renderMap();renderTile()};map.appendChild(b)});let size=innerWidth>=700?60:54;S.armies.forEach(a=>{if(a.st!=='move')return;let d=document.createElement('div');d.className='marcher';d.textContent='⚔️';d.style.left=(4+(a.rx??a.x)*size+12)+'px';d.style.top=(4+(a.ry??a.y)*size+10)+'px';map.appendChild(d)})}function adjacent(t){return nei(t.x,t.y).some(([x,y])=>tile(x,y).o==='me')}function renderTile(){let t=tile(sel.x,sel.y);if(!t.vis){tilePanel.innerHTML='<h3>🌫️ Unexplored</h3><div class="muted">Expand or build watchtowers to reveal this area.</div>';return}let owner=t.o==='me'?'Greyhaven':t.o?(S.ai.find(a=>a.id===t.o)?.n||t.o):'Unclaimed';let h='<div class="top"><div><h3>'+T[t.t][1]+' '+T[t.t][0]+'</h3><div class="muted">'+owner+' · '+t.x+','+t.y+'</div></div>'+(t.b&&t.b!=='castle'?'<button class="info" data-bi="'+t.b+'">i</button>':'')+'</div>';if(!t.o&&t.t!=='water'&&adjacent(t)){let c={gold:20+owned().length*3,food:15};h+='<p class="muted">Borders your realm.</p><button class="btn primary" id="claim">Claim · '+cost(c)+'</button>'}if(t.o==='me'&&!t.b)h+='<p class="muted">Empty owned land. Build from the Kingdom tab.</p>';let idle=S.armies.filter(a=>a.st==='idle');if(t.t!=='water'&&idle.length){h+='<hr style="border-color:#4a3d25"><select id="armySel">'+idle.map(a=>'<option value="'+a.id+'">'+a.n+' · '+Math.round(power(a.u))+' power</option>').join('')+'</select><button class="btn '+(t.o&&t.o!=='me'?'bad':'')+'" id="march" style="margin-top:7px">'+(t.o&&t.o!=='me'?'March to Attack':'Order March')+'</button>'}tilePanel.innerHTML=h;tilePanel.querySelectorAll('[data-bi]').forEach(x=>x.onclick=()=>showBuilding(x.dataset.bi));let c=document.getElementById('claim');if(c)c.onclick=()=>{let cc={gold:20+owned().length*3,food:15};if(!pay(cc))return toast('Not enough resources');t.o='me';reveal(S.map,t.x,t.y,1);log('Claimed '+T[t.t][0].toLowerCase()+' territory.');fx('NEW LAND');renderAll()};let m=document.getElementById('march');if(m)m.onclick=()=>order(+armySel.value,t.x,t.y)}function showBuilding(k){let b=B[k];info(b.n,'<p>'+b.d+'</p><p><b>Cost:</b> '+cost(b.c)+'</p>')}function build(k){let t=tile(sel.x,sel.y),b=B[k];if(!t||t.o!=='me'||t.b)return toast('Select empty land you own');if(!pay(b.c))return toast('Not enough resources');t.b=k;if(k==='watch')reveal(S.map,t.x,t.y,3);log('Built '+b.n+'.');fx('BUILD COMPLETE');renderAll()}function renderKingdom(){stats.innerHTML='<div class="stat"><span>Population</span><b>'+Math.floor(S.pop)+' / '+cap()+'</b></div><div class="stat"><span>Happiness</span><b>'+Math.round(S.happy)+'</b></div><div class="stat"><span>Territory</span><b>'+owned().length+'</b></div><div class="stat"><span>Total troops</span><b>'+troops()+'</b></div>';builds.innerHTML=Object.keys(B).map(k=>{let b=B[k];return'<div class="item"><div class="itemHead"><span><span class="emoji">'+b.e+'</span> <b>'+b.n+'</b></span><button class="info" data-binfo="'+k+'">i</button></div><div class="cost">'+cost(b.c)+'</div><button class="btn" data-build="'+k+'">Build</button></div>'}).join('');builds.querySelectorAll('[data-build]').forEach(x=>x.onclick=()=>build(x.dataset.build));builds.querySelectorAll('[data-binfo]').forEach(x=>x.onclick=()=>showBuilding(x.dataset.binfo))}function recruit(k){if(S.pop<15)return toast('Population too small');if(!pay(U[k].c,5))return toast('Not enough resources');S.pop-=5;S.g[k]+=5;log('Recruited 5 '+U[k].n+'.');renderAll()}function renderArmies(){units.innerHTML=Object.keys(U).map(k=>{let u=U[k];return'<div class="item"><div class="itemHead"><span><span class="emoji">'+u.e+'</span> <b>'+u.n+'</b></span><button class="info" data-uinfo="'+k+'">i</button></div><div class="cost">Power '+u.p+' · '+cost(u.c,5)+'</div><button class="btn" data-rec="'+k+'">Recruit 5</button></div>'}).join('');units.querySelectorAll('[data-rec]').forEach(x=>x.onclick=()=>recruit(x.dataset.rec));units.querySelectorAll('[data-uinfo]').forEach(x=>x.onclick=()=>{let u=U[x.dataset.uinfo];info(u.n,'<p>'+u.d+'</p><p><b>Combat power:</b> '+u.p+' each</p><p><b>Cost for 5:</b> '+cost(u.c,5)+'</p>')});armyList.innerHTML=S.armies.length?S.armies.map(a=>'<div class="card" style="margin:6px 0"><div class="top"><b>'+a.n+'</b><span class="badge">'+(a.st==='move'?'Marching':'Idle')+'</span></div><div class="muted">'+Math.round(power(a.u))+' power · '+Object.values(a.u).reduce((x,y)=>x+y,0)+' troops'+(a.st==='move'?' · '+Math.ceil(a.left)+'s':' · '+a.x+','+a.y)+'</div></div>').join(''):'<div class="muted">No field armies yet.</div>'}function form(){let n=Object.values(S.g).reduce((a,b)=>a+b,0);if(n<5)return toast('Need more garrison troops');let u={};for(const k in S.g){u[k]=Math.floor(S.g[k]/2);S.g[k]-=u[k]}let id=S.next++,a={id,n:'Company '+id,u,x:6,y:6,rx:6,ry:6,st:'idle'};S.armies.push(a);log(a.n+' formed at the capital.');renderAll()}function order(id,x,y){let a=S.armies.find(q=>q.id===id);if(!a||a.st!=='idle')return;let d=Math.abs(a.x-x)+Math.abs(a.y-y);if(!d)return toast('Army is already there');a.ox=a.x;a.oy=a.y;a.tx=x;a.ty=y;a.dur=Math.max(5,d*8);a.left=a.dur;a.st='move';toast('Army marching');renderAll()}function renderDip(){factions.innerHTML=S.ai.map(a=>'<div class="card" style="margin:7px 0"><div class="top"><b>'+a.e+' '+a.n+'</b><span class="badge">'+(a.rel<0?'Cold':a.rel>25?'Friendly':'Neutral')+'</span></div><div class="muted">Army estimate '+Math.round(a.p)+' · '+S.map.filter(t=>t.o===a.id).length+' tiles</div><button class="btn" data-env="'+a.id+'" style="margin-top:7px">Send Envoy · 💰20</button></div>').join('');factions.querySelectorAll('[data-env]').forEach(x=>x.onclick=()=>{if(S.res.gold<20)return toast('Need 20 gold');S.res.gold-=20;let a=S.ai.find(q=>q.id===x.dataset.env);a.rel+=8;log('Relations improved with '+a.n+'.');renderAll()})}function renderLogs(){logs.innerHTML=S.logs.map(l=>'<div class="log"><span class="muted">'+new Date(l.t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+'</span> '+l.m+'</div>').join('')}function renderAll(){renderRes();renderMap();renderTile();renderKingdom();renderArmies();renderDip();renderLogs();season.textContent=season();summary.textContent=Math.floor(S.pop)+' people · '+owned().length+' tiles · '+troops()+' soldiers'}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(b.dataset.v+'View').classList.add('active');renderAll()});document.querySelectorAll('[data-help]').forEach(b=>b.onclick=()=>info('How to Play','<p><b>Expand:</b> tap neighboring neutral land and claim it, or march a field army onto it.</p><p><b>Build:</b> select empty owned land, open Kingdom, then choose a building.</p><p><b>Fight:</b> recruit troops, form a field army, select a foreign tile, and order a march.</p><p><b>Idle:</b> resources and population continue while you are away, up to 8 hours.</p><p>Tap any <b>i</b> button for exact information.</p>'));close.onclick=()=>overlay.classList.add('hidden');overlay.onclick=e=>{if(e.target===overlay)overlay.classList.add('hidden')};center.onclick=()=>{mapwrap.scrollLeft=(map.scrollWidth-mapwrap.clientWidth)/2;mapwrap.scrollTop=(map.scrollHeight-mapwrap.clientHeight)/2};formArmy.onclick=form;reset.onclick=()=>{if(confirm('Erase this kingdom and start over?')){localStorage.removeItem(KEY);S=fresh();save();renderAll();setTimeout(()=>center.click(),50)}};load();renderAll();setTimeout(()=>center.click(),100);function loop(){let n=Date.now(),dt=(n-last)/1000;last=n;step(dt);renderRes();season.textContent=season();if(Math.floor(n/1000)%2===0){renderMap();renderArmies()}requestAnimationFrame(loop)}requestAnimationFrame(loop)})();</script></body></html>
