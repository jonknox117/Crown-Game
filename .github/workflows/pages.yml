                freelancer:window.__GC310_TEST&&window.__GC310_TEST(),
                stakes:window.__GC320_TEST&&window.__GC320_TEST(),
                decisionLock:window.__GC321_TEST&&window.__GC321_TEST(),
                interface:window.__GC330_TEST&&window.__GC330_TEST(),
                qol:window.__GC331_TEST&&window.__GC331_TEST(),
                freelanceCrew:window.__GC332_TEST&&window.__GC332_TEST(),
                presence:window.__GC340_TEST&&window.__GC340_TEST(),
                stability:window.__GC341_TEST&&window.__GC341_TEST(),
                fastStability:window.__GC342_TEST&&window.__GC342_TEST(),
                phoneStability:window.__GC343_TEST&&window.__GC343_TEST(),
                focusStability:window.__GC344_TEST&&window.__GC344_TEST()
              };
              var ok=out.world&&out.world.ok&&out.campaign&&out.campaign.ok&&out.field&&out.field.ok&&out.founder&&out.founder.ok&&out.freeblade&&out.freeblade.ok&&out.command&&out.command.ok&&out.loot&&out.loot.ok&&out.veteran&&out.veteran.ok&&out.partyLegacy&&out.partyLegacy.ok&&out.freelancer&&out.freelancer.ok&&out.stakes&&out.stakes.ok&&out.decisionLock&&out.decisionLock.ok&&out.interface&&out.interface.ok&&out.qol&&out.qol.ok&&out.freelanceCrew&&out.freelanceCrew.ok&&out.presence&&out.presence.ok&&out.stability&&out.stability.ok&&out.fastStability&&out.fastStability.ok&&out.phoneStability&&out.phoneStability.ok&&out.focusStability&&out.focusStability.ok;
              document.body.setAttribute('data-all-tests',ok?'pass':'fail');
              var n=document.createElement('pre');n.id='all-test-output';n.textContent=JSON.stringify(out);document.body.appendChild(n);
            }catch(e){
              document.body.setAttribute('data-all-tests','error');
              var n=document.createElement('pre');n.id='all-test-output';n.textContent=String(e&&e.stack||e);document.body.appendChild(n);
            }
          },1500);
          </script>'''
          Path('grimdark-company/play/all-tests.html').write_text(html.replace('</body>', probe + '</body>'), encoding='utf-8')
          PY
          python3 -m http.server 8768 --bind 127.0.0.1 >/tmp/bl-tests-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; rm -f grimdark-company/play/all-tests.html' EXIT
          sleep 1
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=9000 \
            --dump-dom http://127.0.0.1:8768/grimdark-company/play/all-tests.html \
            >/tmp/bl-tests-dom.html 2>/tmp/bl-tests-chrome.log
          if ! grep -q 'data-all-tests="pass"' /tmp/bl-tests-dom.html; then
            echo "::error::Grim Company behavior self-check failed"
            grep -o '<pre id="all-test-output">[^<]*' /tmp/bl-tests-dom.html || true
            exit 1
          fi
          grep -o '<pre id="all-test-output">[^<]*' /tmp/bl-tests-dom.html || true

