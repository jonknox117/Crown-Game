name: Deploy Broken Lantern to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-v20-3
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build Broken Lantern v20.3 mobile bundle
        run: python3 scripts/build_broken_lantern_mobile.py
      - name: Validate Broken Lantern JavaScript
        run: |
          node --check /tmp/broken-lantern-v9.js
          grep -q "brokenLanternCanonical_v9" grimdark-company/play/index.html
          grep -q "The Shattered Firmament" grimdark-company/play/index.html
          grep -q "FOUND COMPANY" grimdark-company/play/index.html
          grep -q "__BL_AUDIT" grimdark-company/play/index.html
          grep -q "var blPortraitHTML=function" grimdark-company/play/index.html
          grep -q "BL18_MECHANICS_AUDIT" grimdark-company/play/index.html
          grep -q "GC194_MAX_LEVEL=20" grimdark-company/play/index.html
          grep -q "GC195_VERSION='19.5'" grimdark-company/play/index.html
          grep -q "GC199_DAY_MS=45000" grimdark-company/play/index.html
          grep -q "GC200_VERSION='20.00'" grimdark-company/play/index.html
          grep -q "GC200_HOTFIX='20.00.1'" grimdark-company/play/index.html
          grep -q "GC201_VERSION='20.1'" grimdark-company/play/index.html
          grep -q "GC201_STANCES=\['Scout','Patrol','Train','Recover'\]" grimdark-company/play/index.html
          grep -q "GC201_BALANCE='20.1.1'" grimdark-company/play/index.html
          grep -q "GC201_QUALITY='20.1.2'" grimdark-company/play/index.html
          grep -q "GC220_VERSION='20.2'" grimdark-company/play/index.html
          grep -q "GC220_STANCES=\['Scout','Odd Jobs','Train','Recover'\]" grimdark-company/play/index.html
          grep -q "GC230_VERSION='20.3'" grimdark-company/play/index.html
          grep -q "function gc201ContactRate" grimdark-company/play/index.html
          grep -q "function gc201BattleLoop" grimdark-company/play/index.html
          grep -q "function gc201SeedStarterContracts" grimdark-company/play/index.html
          grep -q "function gc202RecoveryMetrics" grimdark-company/play/index.html
          grep -q "function gc202UpdateLiveUI" grimdark-company/play/index.html
          grep -q "oddJobsStance=true" grimdark-company/play/index.html
          grep -q "commandDesk=true" grimdark-company/play/index.html
          grep -q "riskThreatSeparated=true" grimdark-company/play/index.html
          grep -q "ambientWorldPressure=true" grimdark-company/play/index.html
          grep -q "threatExpeditionSafety=true" grimdark-company/play/index.html
          grep -q "stabilityRecruitReliability=true" grimdark-company/play/index.html
          grep -q "prosperityEconomyBenefits=true" grimdark-company/play/index.html
          grep -q "contractRegionalImpact=true" grimdark-company/play/index.html
          grep -q "__GC230_TEST" grimdark-company/play/index.html
          grep -q "name=\"startRegion\"" grimdark-company/play/index.html
          test -f grimdark-company/play-203/index.html
      - name: Browser startup smoke test
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "::error::No Chrome/Chromium executable found on runner"
            exit 1
          fi
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/bl-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=9000 \
            --dump-dom http://127.0.0.1:8765/grimdark-company/play/ \
            >/tmp/bl-dom.html 2>/tmp/bl-chrome.log
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class AppParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.depth = None
                  self.classes = []
                  self.text = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if self.depth is None and tag == 'div' and attrs.get('id') == 'app':
                      self.depth = 1
                      return
                  if self.depth is not None:
                      self.depth += 1
                      if attrs.get('class'):
                          self.classes.extend(attrs['class'].split())
              def handle_endtag(self, tag):
                  if self.depth is not None:
                      self.depth -= 1
                      if self.depth == 0:
                          self.depth = None
              def handle_data(self, data):
                  if self.depth is not None:
                      self.text.append(data)

          dom = Path('/tmp/bl-dom.html').read_text(encoding='utf-8', errors='replace')
          p = AppParser(); p.feed(dom)
          text = ' '.join(p.text)
          classes = set(p.classes)
          rendered = {'startPanel','topbar'} & classes
          if not rendered:
              if 'The ledger failed to open.' in text:
                  raise SystemExit('Browser smoke test hit ledger startup failure: ' + text[:800])
              raise SystemExit('Browser smoke test did not render Grim Company UI. App text: ' + text[:800])
          if 'Choose your first region' not in text and 'topbar' not in rendered:
              raise SystemExit('v20.3 start-region selector did not render.')
          if 'startPanel' in rendered and 'Risk 1 contracts' not in text:
              raise SystemExit('v20.3 fair-start promise did not render.')
          print('Browser startup smoke test passed:', sorted(rendered))
          PY
      - name: World pressure behavior smoke test
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('grimdark-company/play/index.html')
          html = p.read_text(encoding='utf-8')
          probe = r'''<script>
          setTimeout(function(){
            try{
              var r=window.__GC230_TEST&&window.__GC230_TEST();
              document.body.setAttribute('data-gc230-test',r&&r.ok?'pass':'fail');
              var n=document.createElement('pre');n.id='gc230-test-output';n.textContent=JSON.stringify(r||{});document.body.appendChild(n);
            }catch(e){document.body.setAttribute('data-gc230-test','error');var n=document.createElement('pre');n.id='gc230-test-output';n.textContent=String(e&&e.stack||e);document.body.appendChild(n)}
          },1200);
          </script>'''
          Path('grimdark-company/play/gc230-test.html').write_text(html.replace('</body>', probe + '</body>'), encoding='utf-8')
          PY
          python3 -m http.server 8766 --bind 127.0.0.1 >/tmp/bl230-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; rm -f grimdark-company/play/gc230-test.html' EXIT
          sleep 1
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=6000 \
            --dump-dom http://127.0.0.1:8766/grimdark-company/play/gc230-test.html \
            >/tmp/bl230-dom.html 2>/tmp/bl230-chrome.log
          if ! grep -q 'data-gc230-test="pass"' /tmp/bl230-dom.html; then
            echo "::error::v20.3 world-pressure self-check failed"
            grep -o '<pre id="gc230-test-output">[^<]*' /tmp/bl230-dom.html || true
            exit 1
          fi
          grep -o '<pre id="gc230-test-output">[^<]*' /tmp/bl230-dom.html || true
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4