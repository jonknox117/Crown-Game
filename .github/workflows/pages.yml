name: Deploy Broken Lantern to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-v21-2-1
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Grim Company v21.2.1 mobile bundle
        run: python3 scripts/build_grim_company_v21_2_1.py

      - name: Validate JavaScript and release markers
        run: |
          node --check /tmp/broken-lantern-v9.js
          grep -q "brokenLanternCanonical_v9" grimdark-company/play/index.html
          grep -q "GC230_VERSION='20.3'" grimdark-company/play/index.html
          grep -q "GC240_VERSION='20.4'" grimdark-company/play/index.html
          grep -q "GC250_VERSION='20.5'" grimdark-company/play/index.html
          grep -q "GC260_VERSION='20.6'" grimdark-company/play/index.html
          grep -q "GC270_VERSION='20.7'" grimdark-company/play/index.html
          grep -q "GC280_VERSION='20.8'" grimdark-company/play/index.html
          grep -q "GC290_VERSION='20.9'" grimdark-company/play/index.html
          grep -q "GC291_VERSION='20.9.1'" grimdark-company/play/index.html
          grep -q "GC300_VERSION='21.0'" grimdark-company/play/index.html
          grep -q "GC301_VERSION='21.0.1'" grimdark-company/play/index.html
          grep -q "GC310_VERSION='21.1'" grimdark-company/play/index.html
          grep -q "GC320_VERSION='21.2'" grimdark-company/play/index.html
          grep -q "GC321_VERSION='21.2.1'" grimdark-company/play/index.html
          grep -q "playerCharacterIsRosterMember=true" grimdark-company/play/index.html
          grep -q "founderCharacterCreation=true" grimdark-company/play/index.html
          grep -q "modularPortraitSelection=true" grimdark-company/play/index.html
          grep -q "founderPhysicalLocation=true" grimdark-company/play/index.html
          grep -q "directCommandExpeditions=true" grimdark-company/play/index.html
          grep -q "companyContinuesDuringFounderDecision=true" grimdark-company/play/index.html
          grep -q "founderNoPlotArmor=true" grimdark-company/play/index.html
          grep -q "freebladeOpening=true" grimdark-company/play/index.html
          grep -q "companyFoundingIsMilestone=true" grimdark-company/play/index.html
          grep -q "realRosterCommanders=true" grimdark-company/play/index.html
          grep -q "commandersUseRealContracts=true" grimdark-company/play/index.html
          grep -q "itemTriggerEngine=true" grimdark-company/play/index.html
          grep -q "rarityBehaviorIdentity=true" grimdark-company/play/index.html
          grep -q "structuredCareerHistory=true" grimdark-company/play/index.html
          grep -q "earnedTitles=true" grimdark-company/play/index.html
          grep -q "persistentPartyHistory=true" grimdark-company/play/index.html
          grep -q "partyTraditionsHaveEffects=true" grimdark-company/play/index.html
          grep -q "fullContractsBeforeCompany=true" grimdark-company/play/index.html
          grep -q "persistentFreelancerPool=true" grimdark-company/play/index.html
          grep -q "personalContractShares=true" grimdark-company/play/index.html
          grep -q "sameMercenariesRecruitable=true" grimdark-company/play/index.html
          grep -q "shareEconomyNoWeeklyPayroll=true" grimdark-company/play/index.html
          grep -q "founderDecisionGlobalPause=true" grimdark-company/play/index.html
          grep -q "decisionAutoPopup=true" grimdark-company/play/index.html
          grep -q "riskLockedByExperience=true" grimdark-company/play/index.html
          grep -q "downedMortalDanger=true" grimdark-company/play/index.html
          grep -q "retreatIsStrategic=true" grimdark-company/play/index.html
          grep -q "independentWorkAfterFounding=true" grimdark-company/play/index.html
          grep -q "founderFourStancesAlways=true" grimdark-company/play/index.html
          grep -q "fairBeforePunishingAfter=true" grimdark-company/play/index.html
          grep -q "pendingDecisionStopsEverySimulationPath=true" grimdark-company/play/index.html
          grep -q "decisionModalImmediate=true" grimdark-company/play/index.html
          grep -q "decisionModalMandatory=true" grimdark-company/play/index.html
          grep -q "questCannotProgressWhileWaiting=true" grimdark-company/play/index.html
          grep -q "hqCannotProgressWhileWaiting=true" grimdark-company/play/index.html
          grep -q "worldCannotProgressWhileWaiting=true" grimdark-company/play/index.html
          grep -q "__GC230_TEST" grimdark-company/play/index.html
          grep -q "__GC240_TEST" grimdark-company/play/index.html
          grep -q "__GC250_TEST" grimdark-company/play/index.html
          grep -q "__GC260_TEST" grimdark-company/play/index.html
          grep -q "__GC270_TEST" grimdark-company/play/index.html
          grep -q "__GC280_TEST" grimdark-company/play/index.html
          grep -q "__GC290_TEST" grimdark-company/play/index.html
          grep -q "__GC300_TEST" grimdark-company/play/index.html
          grep -q "__GC301_TEST" grimdark-company/play/index.html
          grep -q "__GC310_TEST" grimdark-company/play/index.html
          grep -q "__GC320_TEST" grimdark-company/play/index.html
          grep -q "__GC321_TEST" grimdark-company/play/index.html
          test -f grimdark-company/play-206/index.html
          test -f grimdark-company/play-207/index.html
          test -f grimdark-company/play-208/index.html
          test -f grimdark-company/play-209/index.html
          test -f grimdark-company/play-2091/index.html
          test -f grimdark-company/play-210/index.html
          test -f grimdark-company/play-2101/index.html
          test -f grimdark-company/play-211/index.html
          test -f grimdark-company/play-212/index.html
          test -f grimdark-company/play-2121/index.html

      - name: Browser startup smoke test
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "::error::No Chrome/Chromium executable found on runner"
            exit 1
          fi
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/bl-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=9000 \
            --dump-dom http://127.0.0.1:8765/grimdark-company/play/ \
            >/tmp/bl-dom.html 2>/tmp/bl-chrome.log
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class AppParser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.depth=None; self.classes=[]; self.text=[]; self.ids=[]
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  if self.depth is None and tag=='div' and attrs.get('id')=='app':
                      self.depth=1; return
                  if self.depth is not None:
                      self.depth += 1
                      if attrs.get('class'): self.classes.extend(attrs['class'].split())
                      if attrs.get('id'): self.ids.append(attrs['id'])
              def handle_endtag(self, tag):
                  if self.depth is not None:
                      self.depth -= 1
                      if self.depth==0: self.depth=None
              def handle_data(self, data):
                  if self.depth is not None: self.text.append(data)

          dom=Path('/tmp/bl-dom.html').read_text(encoding='utf-8', errors='replace')
          p=AppParser(); p.feed(dom)
          text=' '.join(p.text); classes=set(p.classes); ids=set(p.ids)
          rendered={'startPanel','topbar'} & classes
          if not rendered:
              print('APP TEXT:', text[:1800])
              print('CHROME STDERR:', Path('/tmp/bl-chrome.log').read_text(encoding='utf-8', errors='replace')[-1800:])
              raise SystemExit('Grim Company UI did not render.')
          if 'startPanel' in rendered:
              for marker in ('Choose where your story begins','Create Yourself','BEGIN AS A FREEBLADE'):
                  if marker not in text: raise SystemExit('v20.8 opening missing text: '+marker)
              for marker in ('founderRace','founderCulture','founderClass'):
                  if marker not in ids: raise SystemExit('v20.8 character creation missing control: '+marker)
          if 'companyName' in ids: raise SystemExit('v20.8 should not ask for a company name before play begins.')
          print('v21.2.1 startup smoke passed:', sorted(rendered))
          PY

      - name: Full progression loot legacy freelancer stakes and decision-lock smoke tests
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('grimdark-company/play/index.html')
          html = p.read_text(encoding='utf-8')
          probe = r'''<script>
          setTimeout(function(){
            try{
              var out={
                world:window.__GC230_TEST&&window.__GC230_TEST(),
                campaign:window.__GC240_TEST&&window.__GC240_TEST(),
                field:window.__GC250_TEST&&window.__GC250_TEST(),
                founder:window.__GC260_TEST&&window.__GC260_TEST(),
                freeblade:window.__GC270_TEST&&window.__GC270_TEST(),
                command:window.__GC280_TEST&&window.__GC280_TEST(),
                loot:window.__GC290_TEST&&window.__GC290_TEST(),
                veteran:window.__GC300_TEST&&window.__GC300_TEST(),
                partyLegacy:window.__GC301_TEST&&window.__GC301_TEST(),
                freelancer:window.__GC310_TEST&&window.__GC310_TEST(),
                stakes:window.__GC320_TEST&&window.__GC320_TEST(),
                decisionLock:window.__GC321_TEST&&window.__GC321_TEST()
              };
              var ok=out.world&&out.world.ok&&out.campaign&&out.campaign.ok&&out.field&&out.field.ok&&out.founder&&out.founder.ok&&out.freeblade&&out.freeblade.ok&&out.command&&out.command.ok&&out.loot&&out.loot.ok&&out.veteran&&out.veteran.ok&&out.partyLegacy&&out.partyLegacy.ok&&out.freelancer&&out.freelancer.ok&&out.stakes&&out.stakes.ok&&out.decisionLock&&out.decisionLock.ok;
              document.body.setAttribute('data-all-tests',ok?'pass':'fail');
              var n=document.createElement('pre');n.id='all-test-output';n.textContent=JSON.stringify(out);document.body.appendChild(n);
            }catch(e){
              document.body.setAttribute('data-all-tests','error');
              var n=document.createElement('pre');n.id='all-test-output';n.textContent=String(e&&e.stack||e);document.body.appendChild(n);
            }
          },1500);
          </script>'''
          Path('grimdark-company/play/all-tests.html').write_text(html.replace('</body>', probe + '</body>'), encoding='utf-8')
          PY
          python3 -m http.server 8768 --bind 127.0.0.1 >/tmp/bl-tests-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; rm -f grimdark-company/play/all-tests.html' EXIT
          sleep 1
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=9000 \
            --dump-dom http://127.0.0.1:8768/grimdark-company/play/all-tests.html \
            >/tmp/bl-tests-dom.html 2>/tmp/bl-tests-chrome.log
          if ! grep -q 'data-all-tests="pass"' /tmp/bl-tests-dom.html; then
            echo "::error::Grim Company behavior self-check failed"
            grep -o '<pre id="all-test-output">[^<]*' /tmp/bl-tests-dom.html || true
            exit 1
          fi
          grep -o '<pre id="all-test-output">[^<]*' /tmp/bl-tests-dom.html || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
