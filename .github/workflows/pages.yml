# v21.8.0 chapterhouse grand visual stage
# v21.4.6 clock hotfix deploy
# v21.4.2 stability deploy
name: Deploy Broken Lantern to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # Stable concurrency key: new releases must cancel older Pages runs.
  group: pages-v21-5-2
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
