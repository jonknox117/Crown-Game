          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class AppParser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.depth=None; self.classes=[]; self.text=[]; self.ids=[]
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  if self.depth is None and tag=='div' and attrs.get('id')=='app':
                      self.depth=1; return
                  if self.depth is not None:
                      self.depth += 1
                      if attrs.get('class'): self.classes.extend(attrs['class'].split())
                      if attrs.get('id'): self.ids.append(attrs['id'])
              def handle_endtag(self, tag):
                  if self.depth is not None:
                      self.depth -= 1
                      if self.depth==0: self.depth=None
              def handle_data(self, data):
                  if self.depth is not None: self.text.append(data)

          dom=Path('/tmp/bl-dom.html').read_text(encoding='utf-8', errors='replace')
          p=AppParser(); p.feed(dom)
          text=' '.join(p.text); classes=set(p.classes); ids=set(p.ids)
          rendered={'startPanel','topbar'} & classes
          if not rendered:
              print('APP TEXT:', text[:1800])
              print('CHROME STDERR:', Path('/tmp/bl-chrome.log').read_text(encoding='utf-8', errors='replace')[-1800:])
              raise SystemExit('Grim Company UI did not render.')
          if 'startPanel' in rendered:
              for marker in ('Choose where your story begins','Create Yourself','BEGIN AS A FREEBLADE'):
                  if marker not in text: raise SystemExit('v20.8 opening missing text: '+marker)
              for marker in ('founderRace','founderCulture','founderClass'):
                  if marker not in ids: raise SystemExit('v20.8 character creation missing control: '+marker)
          if 'companyName' in ids: raise SystemExit('v20.8 should not ask for a company name before play begins.')
          print('v21.10.0 startup smoke passed:', sorted(rendered))
          PY

