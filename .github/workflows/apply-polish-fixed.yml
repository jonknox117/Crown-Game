name: Apply polished Crown build

on:
  push:
    paths:
      - '.github/workflows/apply-polish-fixed.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and install polished build
        shell: bash
        run: |
          awk '/^H4sIA/{flag=1} /^B64$/{flag=0} flag' .github/workflows/apply-polish.yml > /tmp/crown.b64
          base64 -d /tmp/crown.b64 | gunzip > index.html
          test -s index.html
          grep -q 'KINGDOM STRATEGY' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Polish Crown & Frontier UI"
          git push
