name: Grim Company Step 1 Art Pipeline QA
on:
  push:
    paths:
      - 'grimdark-company/art-direction/**'
      - 'scripts/grim_art_pipeline.py'
      - 'tests/test_grim_art_pipeline.py'
      - '.github/workflows/grim-art-pipeline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  art-pipeline-validation:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processing tool
        run: python -m pip install 'Pillow>=10,<12'
      - name: Validate manifest and run real raster exports
        run: |
          python -m unittest discover -s tests -p 'test_grim_art_pipeline.py' -v
          python scripts/grim_art_pipeline.py list
