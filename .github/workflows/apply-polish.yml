name: Apply Crown polish

on:
  push:
    paths:
      - '.github/workflows/apply-polish.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write polished game build
        shell: bash
        run: |
          cat > /tmp/crown.b64 <<'B64'








B64
          base64 -d /tmp/crown.b64 | gunzip > index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Polish Crown & Frontier UI"
          git push
