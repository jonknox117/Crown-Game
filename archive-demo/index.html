const fresh=()=>({version:4,screen:'archive',universe:null,city:null,location:null,lastResult:'',feed:[{t:Date.now(),text:'Archive systems online.'}],discoveries:[],metNPCs:[],quests:{},claims:[],squad:[],channel:null,itemClaims:[],equippedItems:[],inventory:{medPatch:2,focusCell:1,smokeCharge:1},resonance:0,claimEnergy:100,claimEnergyMax:100,player:{hp:100,hpMax:100,atk:18,def:16,spd:16},encounterMeter:0,actionsSinceEncounter:0,firstTalks:{},flags:{},battle:null,stats:{wins:0,losses:0,claims:0,itemClaims:0,encounters:0}});
function load(){let s=fresh();try{const x=JSON.parse(localStorage.getItem(KEY));if(x)s=normalize({...x,version:4})}catch(e){}return s}
function normalize(s){const f=fresh();s={...f,...s};s.version=4;s.player={...f.player,...(s.player||{})};s.inventory={...f.inventory,...(s.inventory||{})};s.stats={...f.stats,...(s.stats||{})};s.flags=s.flags||{};s.firstTalks=s.firstTalks||{};s.claims=(s.claims||[]).filter(id=>TEMPLATES[id]);s.squad=(s.squad||[]).filter(id=>TEMPLATES[id]).slice(0,3);s.itemClaims=(s.itemClaims||[]).filter(id=>CLAIM_ITEMS[id]);s.equippedItems=(s.equippedItems||[]).filter(id=>s.itemClaims.includes(id)).slice(0,2);s.quests=s.quests||{};s.battle=null;if(s.screen==='combat')s.screen=s.location?'location':'archive';return s}
let state=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function log(text){state.feed.unshift({t:Date.now(),text});state.feed=state.feed.slice(0,50);save()}
function toast(text){const d=document.createElement('div');d.className='toast';d.textContent=text;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function addDisc(id,name,type='Intel'){if(state.discoveries.some(d=>d.id===id))return false;state.discoveries.unshift({id,name,type,t:Date.now()});toast('Discovery: '+name);return true}
function hasClaim(id){return state.claims.includes(id)}
function hasItemClaim(id){return state.itemClaims.includes(id)}
function questState(id){if(!state.quests[id])state.quests[id]={status:'inactive',progress:{}};return state.quests[id]}
function startQuest(id){const q=QUESTS[id],qs=questState(id);if(qs.status!=='inactive')return;qs.status='active';q.steps.forEach(s=>qs.progress[s.id]=qs.progress[s.id]||0);log('Quest accepted: '+q.name);toast('Quest accepted: '+q.name);save()}
function questProgress(event,amount=1){Object.entries(state.quests).forEach(([id,qs])=>{if(qs.status!=='active')return;const q=QUESTS[id],step=q.steps.find(s=>s.id===event);if(!step)return;qs.progress[event]=clamp((qs.progress[event]||0)+amount,0,step.need);if(q.steps.every(s=>(qs.progress[s.id]||0)>=s.need)){qs.status='complete';state.resonance+=q.reward.res||0;if(q.reward.item)state.inventory[q.reward.item]=(state.inventory[q.reward.item]||0)+(q.reward.qty||1);log('Quest complete: '+q.name);toast('Quest complete: '+q.name)}});save()}
function hasQuest(id,status){return state.quests[id]?.status===status}
function questStepDone(q,e){const qs=state.quests[q],st=QUESTS[q]?.steps.find(s=>s.id===e);return !!(qs&&st&&(qs.progress[e]||0)>=st.need)}

function sceneSvg(kind){if(kind==='archive')return `<svg viewBox="0 0 700 232" preserveAspectRatio="none"><defs><radialGradient id="a"><stop stop-color="#725bba"/><stop offset="1" stop-color="#111522"/></radialGradient></defs><rect width="700" height="232" fill="url(#a)"/><path d="M0 178h700v54H0z" fill="#090b11"/><g opacity=".28" stroke="#d1af70">${Array.from({length:10},(_,i)=>`<path d="M${i*78} 0v184"/>`).join('')}</g><ellipse cx="350" cy="98" rx="95" ry="108" fill="none" stroke="#d1af70" stroke-width="7" opacity=".78"/><ellipse cx="350" cy="98" rx="72" ry="87" fill="#070910" opacity=".85"/><path d="M305 176h90l25 31H280z" fill="#201b22" stroke="#d1af70" opacity=".85"/></svg>`;
if(kind==='gotham')return `<svg viewBox="0 0 700 232" preserveAspectRatio="none"><rect width="700" height="232" fill="#101828"/><circle cx="560" cy="52" r="28" fill="#aab8cf" opacity=".35"/><path d="M0 166L65 122l40 28 52-82 47 90 72-122 58 129 63-86 58 92 45-46 54 45 46-84 70 92v54H0z" fill="#0a0e17"/><g stroke="#76a7ff" opacity=".24">${Array.from({length:18},(_,i)=>`<path d="M${i*43} -10l-70 250"/>`).join('')}</g></svg>`;
return `<svg viewBox="0 0 700 232" preserveAspectRatio="none"><defs><linearGradient id="m" x2="0" y2="1"><stop stop-color="#4d91da"/><stop offset=".7" stop-color="#91c4ee"/></linearGradient></defs><rect width="700" height="232" fill="url(#m)"/><circle cx="585" cy="46" r="30" fill="#fff1b4" opacity=".82"/><path d="M0 184h700v48H0z" fill="#182236"/><path d="M55 184V90h65v94M145 184V56h80v128M250 184V110h60v74M338 184V42h78v142M445 184V82h72v102M545 184V62h96v122" fill="#263b5a"/></svg>`}
function header(){return `<div class="topbar"><div class="brand"><small>Sovereign Archive</small><strong>${state.screen==='combat'?'Auto Battle':state.city?CITY[state.city].name:'The Archive'}</strong></div><div class="topStat">CE <b>${state.claimEnergy}</b></div><div class="topStat">R <b>${state.resonance}</b></div></div>`}
function nav(){if(state.screen==='combat')return '';return `<div class="bottomNav"><button class="navBtn" data-nav="world"><b>⌂</b>World</button><button class="navBtn" data-nav="quests"><b>◆</b>Quests</button><button class="navBtn" data-nav="claims"><b>◉</b>Claims</button><button class="navBtn" data-nav="bag"><b>▣</b>Gear</button></div>`}
function render(){clearTimeout(autoTimer);document.body.className=state.city?CITY[state.city].theme:'archiveGlow';if(state.screen==='combat')return renderCombat();app.innerHTML=header()+`<main class="main">${state.screen==='archive'?archiveView():state.screen==='portal'?portalView():state.screen==='city'?cityView():locationView()}</main>`+nav();bindCommon();save()}
function archiveView(){return `<section class="scene">${sceneSvg('archive')}<div class="sceneShade"></div><div class="sceneText"><div class="eyebrow">Home Space · Safe</div><div class="sceneTitle">The Archive</div><div class="sceneSub">Your private anchor between universes. Living templates, claimed objects, techniques, and portal routes are stabilized here.</div></div></section><div class="section"><div class="stats"><div class="stat"><b>${state.claims.length}</b><span>Living Claims</span></div><div class="stat"><b>${state.itemClaims.length}</b><span>Item Claims</span></div><div class="stat"><b>${state.stats.wins}</b><span>Wins</span></div><div class="stat"><b>${Object.values(state.quests).filter(q=>q.status==='complete').length}</b><span>Quests</span></div></div></div><div class="section"><button class="choice" data-go="portal"><strong>Enter Portal Chamber</strong><p>DC is currently the only stable universe route.</p><span class="arrow">›</span></button></div><div class="section"><div class="card"><div class="grid two"><button class="btn good" data-rest>Stabilize & Recover</button><button class="btn" data-nav="claims">Manage Archive</button></div><p class="tip">Recovery restores Jon and Claim Energy. Your assigned squad automatically deploys beside you in combat.</p></div></div>`}
function portalView(){return `<section class="scene">${sceneSvg('archive')}<div class="sceneShade"></div><div class="sceneText"><div class="eyebrow">Portal Chamber</div><div class="sceneTitle">Destination</div><div class="sceneSub">One universe is indexed. Gotham and Metropolis both have stable arrival anchors.</div></div></section><div class="section"><button class="choice" data-universe="dc"><strong>DC Universe</strong><p>Gotham City · Metropolis</p><span class="arrow">›</span></button></div><div class="section"><div class="grid two"><button class="choice locked"><strong>Unknown Universe</strong><p>Anchor not established.</p></button><button class="choice locked"><strong>Unknown Universe</strong><p>Anchor not established.</p></button></div></div>`}
function cityView(){const c=CITY[state.city];return `<section class="scene">${sceneSvg(state.city==='gotham'?'gotham':'metro')}<div class="sceneShade"></div><div class="sceneText"><div class="eyebrow">DC Universe</div><div class="sceneTitle">${c.name}</div><div class="sceneSub">${c.subtitle}</div></div></section><div class="section"><div class="sectionTitle"><h2>Districts</h2><span>${Object.keys(c.locations).length} accessible</span></div><div class="grid">${Object.entries(c.locations).map(([id,l])=>`<button class="choice" data-location="${id}"><strong>${l.icon} ${l.name}</strong><p>${l.desc}</p><span class="arrow">›</span></button>`).join('')}</div></div><div class="section"><div class="grid two"><button class="btn" data-switchcity>${state.city==='gotham'?'Travel to Metropolis':'Travel to Gotham'}</button><button class="btn" data-home>Return to Archive</button></div></div>`}
function encounterOdds(action){let base=.4+state.encounterMeter/250;if(action==='Talk')base+=.12;if(action==='Investigate')base+=.08;if(state.actionsSinceEncounter>=3)base+=.18;return clamp(base,.32,.88)}
function locationView(){const l=CITY[state.city].locations[state.location];const odds=Math.round(encounterOdds('Observe')*100);return `<section class="scene">${sceneSvg(state.city==='gotham'?'gotham':'metro')}<div class="sceneShade"></div><div class="sceneText"><div class="eyebrow">${CITY[state.city].name}</div><div class="sceneTitle">${l.name}</div><div class="sceneSub">${l.desc}</div></div></section><div class="section"><div class="card"><div class="locationBanner"><div class="locIcon">${l.icon}</div><div><strong>World Activity</strong><p>Every RP action can produce a fight, named encounter, item, lead, quest progress, or quieter scene beat.</p></div></div><div class="questProgress"><small><span>Encounter pressure</span><span>${state.encounterMeter}% · ~${odds}% event</span></small><div class="meter"><i style="width:${state.encounterMeter}%"></i></div></div></div></div><div class="section"><div class="sectionTitle"><h2>Interact</h2><span>Roleplay still matters</span></div><div class="actionGrid">${l.actions.map(a=>`<button class="action" data-action="${a}"><b>${a}</b><small>${actionHint(a)}</small></button>`).join('')}</div></div>${state.lastResult?`<div class="section"><div class="result">${state.lastResult}</div></div>`:''}<div class="section"><div class="grid two"><button class="btn" data-backcity>Change District</button><button class="btn" data-home>Return to Archive</button></div></div>`}
function actionHint(a){return ({Observe:'Survey movement and changes.',Explore:'Push deeper into the district.',Talk:'Approach whoever is around.',Investigate:'Search for leads and anomalies.',Listen:'Monitor chatter and scanners.',Browse:'Check public systems and records.'})[a]||'Interact with the scene.'}
function bindCommon(){document.querySelectorAll('[data-go="portal"]').forEach(b=>b.onclick=()=>{state.screen='portal';render()});document.querySelectorAll('[data-universe]').forEach(b=>b.onclick=()=>{state.universe='dc';state.screen='city';state.city=state.city||'gotham';state.location=null;render()});document.querySelectorAll('[data-location]').forEach(b=>b.onclick=()=>{state.location=b.dataset.location;state.screen='location';state.lastResult='';render()});document.querySelectorAll('[data-switchcity]').forEach(b=>b.onclick=()=>{state.city=state.city==='gotham'?'metropolis':'gotham';state.location=null;state.screen='city';render()});document.querySelectorAll('[data-backcity]').forEach(b=>b.onclick=()=>{state.screen='city';state.location=null;state.lastResult='';render()});document.querySelectorAll('[data-home]').forEach(b=>b.onclick=goHome);document.querySelectorAll('[data-rest]').forEach(b=>b.onclick=()=>{state.player.hp=state.player.hpMax;state.claimEnergy=state.claimEnergyMax;toast('Fully stabilized');render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>worldAction(b.dataset.action));document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>openPanel(b.dataset.nav))}
function goHome(){clearTimeout(autoTimer);state.screen='archive';state.city=null;state.location=null;state.lastResult='';state.encounterMeter=0;state.player.hp=state.player.hpMax;state.claimEnergy=state.claimEnergyMax;state.battle=null;log('Returned to the Archive.');render()}

const flavor={gotham:{central:['A patrol car returns with a shattered rear window. Nobody explains it.','Two detectives hurry out with coffee abandoned on the desk.'],narrows:['A rooftop silhouette disappears when lightning brightens the block.','A shop gate slams shut half a block ahead.'],docks:['A crane stops mid-lift while three workers stare toward warehouse twelve.','One freighter runs completely dark.'],wayne:['A black executive car exits Wayne Tower without an escort.','Several rooftop cameras are newer than the systems beneath them.'],eastend:['A jewelry-store alarm starts, stops, then starts again two blocks away.','Someone crosses three roofs without ever touching street level.'],ace:['Chemical light flickers behind an upper catwalk.','A service gate hangs open despite a fresh electronic lock.']},metropolis:{planet:['Half the plaza looks upward at once. Phones come out too late.','A reporter runs out of the Planet while still typing.'],park:['A sonic boom rolls far above the skyline, then fades.','Two children argue about a distant red streak.'],star:['A security door cycles twice before accepting a badge.','Technicians move a scorched drone chassis behind glass.'],southside:['A truck unloads sealed crates with no company markings.','Three lookouts rotate positions with practiced timing.'],lexcorp:['A security team changes formation when you stop walking.','A drone shadows the plaza at exactly the legal altitude limit.'],suicide:['A corner store owner pulls a kid inside just before a convoy passes.','A freight door closes as soon as you look directly at it.']}};
function worldAction(action){const l=CITY[state.city].locations[state.location];state.actionsSinceEncounter++;state.encounterMeter=clamp(state.encounterMeter+Math.floor(13+Math.random()*18),0,100);const firstKey=state.city+'_'+state.location;if(action==='Talk'&&!state.firstTalks[firstKey]&&l.npcs.length){state.firstTalks[firstKey]=true;save();return encounterNPC(l.npcs[0])}const roll=Math.random(),eventChance=encounterOdds(action);if(roll>eventChance){state.lastResult=`<span class="tag">Scene</span>${rand(flavor[state.city][state.location])}`;if(chance(.35)){const id='intel_'+state.city+'_'+state.location+'_'+Math.floor(Math.random()*5);if(addDisc(id,'Local Pattern: '+l.name,'Observation'))state.lastResult+=`<br><br><strong>Useful:</strong> Pattern archived.`}save();return render()}let r=Math.random();if(action==='Talk')r-=.18;if(action==='Investigate')r+=.08;if(r<.25&&l.npcs.length)return encounterNPC(rand(l.npcs));if(r<.65)return encounterCombat(makeEnemyGroup(l));if(r<.83)return infoEvent();return itemEvent(l)}
function resetPressure(){state.actionsSinceEncounter=0;state.encounterMeter=Math.max(0,state.encounterMeter-55)}
function makeEnemyGroup(l){let n=1;if(chance(.52))n=2;if(chance(.22))n=3;const first=rand(l.pool);if(TEMPLATES[first].rarity==='Boss')return [first];const arr=[first];while(arr.length<n){const x=rand(l.pool);if(TEMPLATES[x].rarity!=='Boss')arr.push(x)}return arr}
function infoEvent(){const c=state.city,l=state.location;let text='You connect several small details into something useful.',event=null;if(c==='gotham'&&l==='docks'&&hasQuest('missingEvidence','active')&&!questStepDone('missingEvidence','dock_clue')){event='dock_clue';text='A broken evidence seal matches Montoya’s missing shipment.'}else if(c==='gotham'&&l==='docks'&&hasQuest('redHoodCargo','active')&&!questStepDone('redHoodCargo','dock_manifest')){event='dock_manifest';text='A transfer manifest is hidden inside a forklift panel.'}else if(c==='gotham'&&l==='narrows'&&hasQuest('voltageTrail','active')&&!questStepDone('voltageTrail','narrows_arc')){event='narrows_arc';text='The obvious scorch marks are bait. The real current bled into a conduit two blocks east.'}else if(c==='metropolis'&&l==='southside'&&hasQuest('intergangSource','active')&&!questStepDone('intergangSource','southside_clue')){event='southside_clue';text='Alien-energy residue converges on a warehouse with a fake permit.'}else if(c==='metropolis'&&l==='star'&&hasQuest('steelSignal','active')&&!questStepDone('steelSignal','star_signal')){event='star_signal';text='The rogue signal is piggybacking on a public calibration beacon.'}else{addDisc('intel_'+uid(),'Actionable '+CITY[c].locations[l].name+' Intel','Intel');text='A useful local pattern is added to the Archive.'}if(event)questProgress(event);state.lastResult=`<span class="tag">Useful Intel</span>${text}`;resetPressure();save();render()}
function itemEvent(l){resetPressure();const id=rand(l.items||Object.keys(CLAIM_ITEMS));openItemEncounter(id)}
function openItemEncounter(id){const it=CLAIM_ITEMS[id],d=sheet('Object Encounter','Sovereign Claim works on coherent non-living targets too.');d.querySelector('.sheet').insertAdjacentHTML('beforeend',`<div class="listItem"><div class="npcRow"><div class="gearIcon">${it.icon}</div><div><strong>${it.name}</strong> <span class="pill">${it.rarity}</span><p>${it.desc}</p></div></div><div class="miniBtns"><button class="miniBtn active" data-claimitem="${id}" ${hasItemClaim(id)||state.claimEnergy<it.cost?'disabled':''}>${hasItemClaim(id)?'Already Claimed':state.claimEnergy<it.cost?'Need '+it.cost+' CE':'Claim Object · '+it.cost+' CE'}</button><button class="miniBtn" data-takeitem>Leave it</button></div></div>`);d.querySelectorAll('[data-claimitem]').forEach(b=>b.onclick=()=>{claimItem(b.dataset.claimitem);d.remove();render()});d.querySelectorAll('[data-takeitem]').forEach(b=>b.onclick=()=>{d.remove();state.lastResult=`<span class="tag">Object</span>You inspect <strong>${it.name}</strong> and leave it where it is.`;render()})}
function claimItem(id){const it=CLAIM_ITEMS[id];if(!it||hasItemClaim(id)||state.claimEnergy<it.cost)return;state.claimEnergy-=it.cost;state.itemClaims.push(id);state.stats.itemClaims++;log('Claimed object: '+it.name+'.');toast(it.name+' archived');save()}

function npcQuest(id){return ({montoya:'missingEvidence',nightwing:'voltageTrail',redhood:'redHoodCargo',lois:'intergangSource',steel:'steelSignal'})[id]||null}
function encounterNPC(id){resetPressure();state.stats.encounters++;if(!state.metNPCs.includes(id))state.metNPCs.push(id);const n=NPCS[id],qid=npcQuest(id);if(qid)questProgress('talk_'+id);log('Encountered '+n.name+'.');openNPC(id,qid)}
function openNPC(id,qid){const n=NPCS[id],q=qid&&QUESTS[qid],qs=qid&&questState(qid);let qBlock='';if(q){if(qs.status==='inactive')qBlock=`<div class="dialogue"><strong>${q.name}</strong><br>${q.desc}</div><div class="miniBtns"><button class="miniBtn active" data-acceptq="${qid}">Accept Quest</button></div>`;else if(qs.status==='active')qBlock=`<div class="dialogue"><strong>Quest active: ${q.name}</strong><br>${currentObjective(qid)}</div>`;else qBlock=`<div class="dialogue"><strong>${q.name} — complete</strong></div>`}const d=sheet('Character Encounter');d.querySelector('.sheet').insertAdjacentHTML('beforeend',`<div class="npcRow"><div class="npcPortrait">${n.icon}</div><div><h3>${n.name}</h3><p>${n.role}</p></div></div><div class="dialogue">${n.intro}<br><br><strong>${rand(n.lines)}</strong></div>${qBlock}<div class="miniBtns"><button class="miniBtn" data-npcintel>Ask what they know</button><button class="miniBtn" data-npcleave>Leave</button></div>`);d.querySelectorAll('[data-acceptq]').forEach(b=>b.onclick=()=>{startQuest(b.dataset.acceptq);questProgress('talk_'+id);d.remove();render()});d.querySelectorAll('[data-npcintel]').forEach(b=>b.onclick=()=>{addDisc('npc_'+id,'Intel from '+n.name,'Character Intel');toast('Intel archived')});d.querySelectorAll('[data-npcleave]').forEach(b=>b.onclick=()=>{d.remove();state.lastResult=`<span class="tag">Named Encounter</span>You met <strong>${n.name}</strong>.`;render()})}
function currentObjective(id){const q=QUESTS[id],qs=state.quests[id],s=q.steps.find(st=>(qs.progress[st.id]||0)<st.need);return s?'Current objective: '+s.text:'All objectives complete.'}

function loadoutStats(){let x={hp:state.player.hpMax,atk:state.player.atk,def:state.player.def,spd:state.player.spd,moves:['strike','guard','sovereignPulse',state.channel&&MOVES[state.channel]?state.channel:'repulsor']};state.equippedItems.forEach(id=>{const it=CLAIM_ITEMS[id];if(!it)return;x.hp+=it.stats?.hp||0;x.atk+=it.stats?.atk||0;x.def+=it.stats?.def||0;x.spd+=it.stats?.spd||0;if(it.move&&!x.moves.includes(it.move))x.moves.push(it.move)});return x}
function fighterFromTemplate(id,side='ally'){const t=TEMPLATES[id];return {uid:uid(),templateId:id,side,name:t.name,hp:t.stats.hp,maxHp:t.stats.hp,atk:t.stats.atk,def:t.stats.def,spd:t.stats.spd,moves:[...t.moves],status:{},guard:0,evade:0,form:side==='enemy'?'enemy':'manifest'} }
function jonFighter(){const s=loadoutStats(),ratio=clamp(state.player.hp/state.player.hpMax,.01,1);return {uid:'jon',templateId:null,side:'ally',name:'Jon',hp:Math.max(1,Math.round(s.hp*ratio)),maxHp:s.hp,atk:s.atk,def:s.def,spd:s.spd,moves:[...new Set(s.moves)],status:{},guard:0,evade:0,form:'jon'} }
function encounterCombat(ids){resetPressure();state.stats.encounters++;const team=[jonFighter(),...state.squad.map(id=>fighterFromTemplate(id,'ally'))],enemies=ids.map(id=>fighterFromTemplate(id,'enemy'));state.battle={id:uid(),team,enemies,round:1,tactic:'balanced',running:false,speed:1,log:`Hostiles detected: <strong>${enemies.map(e=>e.name).join(', ')}</strong>. Your assigned squad manifests beside you.`,result:null,claimed:[],defeated:[]};state.screen='combat';log('Combat encounter: '+enemies.map(e=>e.name).join(', ')+'.');save();render()}
function living(arr){return arr.filter(x=>x.hp>0)}
function hpUI(c){const per=pct(c.hp,c.maxHp);return `<div class="hpbar ${per<30?'low':''}"><i style="width:${per}%"></i></div><div class="hpText"><span>HP</span><span>${Math.max(0,c.hp)} / ${c.maxHp}</span></div>`}
function unitCard(c){return `<div class="unit ${c.side==='enemy'?'enemy':'hero'} ${c.hp<=0?'dead':''}"><div class="unitName"><strong>${c.name}</strong><span>${c.form==='jon'?'JON':c.form==='transform'?'TRANSFORM':c.side==='enemy'?(TEMPLATES[c.templateId]?.rarity||'HOSTILE'):'MANIFEST'}</span></div>${hpUI(c)}<div class="unitStats"><span>ATK ${c.atk}</span><span>DEF ${c.def}</span><span>SPD ${c.spd}</span>${c.status.stun?'<span>STUN</span>':''}${c.status.bleed?'<span>BLEED</span>':''}</div></div>`}
function renderCombat(){const b=state.battle;if(!b){state.screen=state.location?'location':'archive';return render()}const allyLiving=living(b.team).length,enemyLiving=living(b.enemies).length;app.innerHTML=header()+`<main class="combatWrap"><div class="battleShell"><div class="battleTop"><div><strong>${b.result?'Battle Resolved':'Round '+b.round}</strong><br><span>${allyLiving} allies active · ${enemyLiving} hostiles active</span></div><span>${b.running?'AUTO RUNNING':'AUTO PAUSED'}</span></div><div class="formation"><div class="sideCol">${b.team.map(unitCard).join('')}</div><div class="versus">VS</div><div class="sideCol">${b.enemies.map(unitCard).join('')}</div></div><div class="battleLog">${b.log}</div></div>${b.result==='victory'?victoryUI():b.result==='defeat'?defeatUI():combatControls()}</main>`;bindCombat();save();if(b.running)scheduleAuto()}
function combatControls(){const b=state.battle;return `<div class="controlCard"><div class="sectionTitle"><h2>Team Tactic</h2><span>Everyone acts automatically</span></div><div class="tactics"><button class="tacticBtn ${b.tactic==='balanced'?'active':''}" data-tactic="balanced">Balanced</button><button class="tacticBtn ${b.tactic==='focus'?'active':''}" data-tactic="focus">Focus Fire</button><button class="tacticBtn ${b.tactic==='defensive'?'active':''}" data-tactic="defensive">Defensive</button></div><div class="autoRow"><button class="btn primary" data-auto>${b.running?'Pause Auto':'Start Auto'}</button><button class="btn" data-round>1 Round</button><button class="btn" data-speed>${b.speed===1?'1× Speed':'2× Speed'}</button></div><div class="battleActionRow"><button class="btn" data-transform>Transform</button><button class="btn" data-battleitem>Use Item</button><button class="btn" data-flee>Flee</button></div></div>`}
function bindCombat(){document.querySelectorAll('[data-tactic]').forEach(x=>x.onclick=()=>{state.battle.tactic=x.dataset.tactic;render()});document.querySelectorAll('[data-auto]').forEach(x=>x.onclick=()=>{state.battle.running=!state.battle.running;render()});document.querySelectorAll('[data-round]').forEach(x=>x.onclick=()=>{state.battle.running=false;runAutoRound();render()});document.querySelectorAll('[data-speed]').forEach(x=>x.onclick=()=>{state.battle.speed=state.battle.speed===1?2:1;render()});document.querySelectorAll('[data-transform]').forEach(x=>x.onclick=transformPanel);document.querySelectorAll('[data-battleitem]').forEach(x=>x.onclick=battleItemPanel);document.querySelectorAll('[data-flee]').forEach(x=>x.onclick=fleeBattle);document.querySelectorAll('[data-claimenemy]').forEach(x=>x.onclick=()=>claimEnemy(x.dataset.claimenemy));document.querySelectorAll('[data-finishbattle]').forEach(x=>x.onclick=finishBattle);document.querySelectorAll('[data-homeafterloss]').forEach(x=>x.onclick=()=>{state.battle=null;goHome()})}
function scheduleAuto(){clearTimeout(autoTimer);const b=state.battle;if(!b||!b.running||b.result)return;autoTimer=setTimeout(()=>{if(!state.battle||!state.battle.running)return;runAutoRound();render()},b.speed===2?430:820)}
function chooseMove(c,tactic){const moves=c.moves.filter(id=>MOVES[id]);const hp=c.hp/c.maxHp;if(tactic==='defensive'&&hp<.5&&moves.includes('guard')&&chance(.6))return 'guard';if(hp<.25&&moves.includes('guard')&&chance(.45))return 'guard';const attacks=moves.filter(id=>MOVES[id].power>0);if(tactic==='focus'&&attacks.length)return attacks.sort((a,b)=>(MOVES[b].power||0)-(MOVES[a].power||0))[chance(.55)?0:Math.floor(Math.random()*attacks.length)];if(tactic==='defensive'&&moves.includes('smokeStep')&&chance(.2))return 'smokeStep';return rand(attacks.length?attacks:moves)}
function chooseTarget(actor){const b=state.battle;if(actor.side==='enemy'){const al=living(b.team);const jon=al.find(x=>x.uid==='jon');if(jon&&chance(.48))return jon;return rand(al)}const en=living(b.enemies);if(b.tactic==='focus')return [...en].sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0];return rand(en)}
function moveDamage(att,def,m){if(!m.power)return 0;let dmg=m.power*(att.atk/Math.max(6,def.def))*.7*(.88+Math.random()*.22);if(def.guard)dmg*=def.guard===2?.35:.55;return Math.max(2,Math.round(dmg))}
function actMove(actor,target,id){const m=MOVES[id];if(!m||!target)return '';if(actor.status.stun>0&&chance(.55)){actor.status.stun--;return `${actor.name} is stunned.`}if(target.evade>0&&chance(.36)){target.evade--;return `${target.name} evades ${m.name}.`}if(Math.random()*100>m.acc)return `${actor.name}'s ${m.name} misses.`;if(m.effect==='guard'){actor.guard=1;return `${actor.name} guards.`}if(m.effect==='guardStrong'){actor.guard=2;return `${actor.name} braces behind heavy protection.`}if(m.effect==='evade'){actor.evade=2;return `${actor.name} shifts into concealment.`}const dmg=moveDamage(actor,target,m);target.hp=Math.max(0,target.hp-dmg);let s=`${actor.name} → <strong>${m.name}</strong> (${dmg})`;if(m.status&&chance(m.statusChance)){target.status[m.status]=m.status==='bleed'?3:2;s+=` · ${m.status}`;}return s}
function tickStatus(c){let s='';if(c.status.bleed>0&&c.hp>0){const d=Math.max(3,Math.round(c.maxHp*.05));c.hp=Math.max(0,c.hp-d);c.status.bleed--;s=`${c.name} bleeds for ${d}.`}if(c.guard)c.guard=0;if(c.evade>0)c.evade--;return s}
function runAutoRound(){const b=state.battle;if(!b||b.result)return;let actors=[...living(b.team),...living(b.enemies)].sort((a,c)=>c.spd-a.spd),lines=[];for(const actor of actors){if(actor.hp<=0)continue;const target=chooseTarget(actor);if(!target)break;const move=chooseMove(actor,actor.side==='enemy'?'balanced':b.tactic);const txt=actMove(actor,target,move);if(txt)lines.push(txt);if(target.hp<=0){lines.push(`<strong>${target.name} is down.</strong>`);if(target.side==='enemy')b.defeated.push(target.templateId)}if(!living(b.enemies).length||!living(b.team).length)break}for(const c of [...b.team,...b.enemies]){const t=tickStatus(c);if(t)lines.push(t)}b.log=lines.join('<br>')||'The teams reposition.';b.round++;checkBattleEnd();save()}
function checkBattleEnd(){const b=state.battle;if(!living(b.enemies).length){b.result='victory';b.running=false;state.stats.wins++;const unique=[...new Set(b.enemies.map(e=>e.templateId))];const reward=unique.reduce((n,id)=>n+8+Math.floor(TEMPLATES[id].cost*.35),0);state.resonance+=reward;const jon=b.team.find(x=>x.uid==='jon');if(jon){const ratio=jon.hp/jon.maxHp;state.player.hp=Math.max(1,Math.round(state.player.hpMax*ratio))}const map={blackMaskEnforcer:'beat_blackmask',penguinGunman:'beat_penguin',electrocutioner:'beat_electrocutioner',intergangHeavy:'beat_intergangheavy',lexDrone:'beat_lexdrone'};unique.forEach(id=>{if(map[id])questProgress(map[id])});log('Victory over '+unique.map(id=>TEMPLATES[id].name).join(', ')+'.');return}if(!living(b.team).length){b.result='defeat';b.running=false;state.stats.losses++;state.resonance=Math.max(0,state.resonance-10);state.player.hp=1;log('Combat defeat.')}}
function victoryUI(){const b=state.battle,unique=[...new Set(b.enemies.map(e=>e.templateId))];return `<div class="section"><div class="victory"><h2>Victory</h2><p>Defeated targets are available for Sovereign Claim. Claim any template you can afford, then leave when ready.</p><div class="claimGrid">${unique.map(id=>{const t=TEMPLATES[id],owned=hasClaim(id),can=state.claimEnergy>=t.cost;return `<div class="claimReward"><strong>${t.name} · ${t.rarity}</strong><p>HP ${t.stats.hp} · ATK ${t.stats.atk} · DEF ${t.stats.def} · SPD ${t.stats.spd}</p><button class="btn ${can&&!owned?'primary':''}" data-claimenemy="${id}" ${owned||!can?'disabled':''}>${owned?'Claimed':can?'Claim · '+t.cost+' CE':'Need '+t.cost+' CE'}</button></div>`}).join('')}</div><button class="btn good" data-finishbattle style="margin-top:10px">Leave Encounter</button></div></div>`}
function defeatUI(){return `<div class="section"><div class="victory" style="border-color:rgba(255,105,123,.28)"><h2>Defeated</h2><p>The Archive anchor catches you. You lose 10 Resonance and return injured.</p><button class="btn danger" data-homeafterloss>Return to Archive</button></div></div>`}
function claimEnemy(id){const t=TEMPLATES[id];if(!t||hasClaim(id)||state.claimEnergy<t.cost)return;state.claimEnergy-=t.cost;state.claims.push(id);state.stats.claims++;state.battle.claimed.push(id);log('Claimed template: '+t.name+'.');toast(t.name+' archived');render()}
function finishBattle(){const b=state.battle,defeated=[...new Set(b.enemies.map(e=>TEMPLATES[e.templateId].name))];state.battle=null;state.screen='location';state.lastResult=`<span class="tag">Combat Victory</span>Your team defeated <strong>${defeated.join(', ')}</strong>.`;render()}
function fleeBattle(){const b=state.battle,avg=living(b.team).reduce((n,x)=>n+x.spd,0)/Math.max(1,living(b.team).length),enemy=living(b.enemies).reduce((n,x)=>n+x.spd,0)/Math.max(1,living(b.enemies).length);if(chance(clamp(.48+(avg-enemy)*.012,.2,.82))){b.running=false;state.battle=null;state.screen='location';state.lastResult='<span class="tag">Escaped</span>Your team disengages.';return render()}b.log='The enemy blocks your escape.';runAutoRound();render()}
function transformPanel(){if(!state.claims.length)return toast('No living templates claimed');const d=sheet('Transform Jon','Transformation changes Jon only. Your manifested teammates stay on the field.');state.claims.forEach(id=>{const t=TEMPLATES[id];d.querySelector('.sheet').insertAdjacentHTML('beforeend',`<div class="listItem"><div class="npcRow"><div class="npcPortrait">${t.icon}</div><div><strong>${t.name}</strong><p>HP ${t.stats.hp} · ATK ${t.stats.atk} · DEF ${t.stats.def} · SPD ${t.stats.spd}</p></div></div><button class="miniBtn" data-transform="${id}">Transform</button></div>`)});d.querySelectorAll('[data-transform]').forEach(x=>x.onclick=()=>{const b=state.battle,old=b.team.find(u=>u.uid==='jon'),id=x.dataset.transform,t=TEMPLATES[id],ratio=old.hp/old.maxHp,n=fighterFromTemplate(id,'ally');n.uid='jon';n.form='transform';n.name='Jon — '+t.name;n.hp=Math.max(1,Math.round(n.maxHp*ratio));b.team[b.team.findIndex(u=>u.uid==='jon')]=n;b.log=`Jon transforms into <strong>${t.name}</strong> while the squad keeps fighting.`;d.remove();render()})}
function battleItemPanel(){const d=sheet('Combat Items','A consumable is an intervention. It does not add extra combat micromanagement.');Object.entries(ITEMS).forEach(([id,it])=>d.querySelector('.sheet').insertAdjacentHTML('beforeend',`<div class="listItem"><strong>${it.name} × ${state.inventory[id]||0}</strong><p>${it.desc}</p><button class="miniBtn" data-usebattle="${id}" ${(state.inventory[id]||0)<=0?'disabled':''}>Use</button></div>`));d.querySelectorAll('[data-usebattle]').forEach(x=>x.onclick=()=>{const id=x.dataset.usebattle;if((state.inventory[id]||0)<=0)return;state.inventory[id]--;const jon=state.battle.team.find(u=>u.uid==='jon');if(id==='medPatch'&&jon)jon.hp=Math.min(jon.maxHp,jon.hp+35);if(id==='focusCell')state.claimEnergy=Math.min(state.claimEnergyMax,state.claimEnergy+30);if(id==='smokeCharge'&&jon)jon.evade=3;state.battle.log=ITEMS[id].name+' used.';d.remove();render()})}

function sheet(title,sub=''){const d=document.createElement('div');d.className='overlay';d.innerHTML=`<div class="sheet"><div class="sheetHead"><div><h2>${title}</h2>${sub?`<div class="tip">${sub}</div>`:''}</div><button class="close">×</button></div></div>`;document.body.appendChild(d);d.querySelector('.close').onclick=()=>d.remove();d.onclick=e=>{if(e.target===d)d.remove()};return d}
function openPanel(name){if(name==='world'){if(state.screen==='archive')return;return goHome()}if(name==='quests')return questsPanel();if(name==='claims')return claimsPanel();if(name==='bag')return bagPanel()}
function questsPanel(){const d=sheet('Quests','Named characters offer persistent objectives.');const ids=Object.keys(state.quests).filter(id=>state.quests[id].status!=='inactive');if(!ids.length)d.querySelector('.sheet').insertAdjacentHTML('beforeend','<div class="card"><p class="tip">No quests yet. Talk to named characters in Gotham or Metropolis.</p></div>');ids.forEach(id=>{const q=QUESTS[id],qs=state.quests[id],done=q.steps.filter(s=>(qs.progress[s.id]||0)>=s.need).length;d.querySelector('.sheet').insertAdjacentHTML('beforeend',`<div class="listItem"><strong>${q.name} <span class="pill ${qs.status==='complete'?'good':'warn'}">${qs.status}</span></strong><p>${q.desc}</p><div class="questProgress"><small><span>${done}/${q.steps.length} objectives</span><span>${Math.round(done/q.steps.length*100)}%</span></small><div class="meter"><i style="width:${done/q.steps.length*100}%"></i></div></div>${q.steps.map(s=>`<p>${(qs.progress[s.id]||0)>=s.need?'✓':'○'} ${s.text}</p>`).join('')}</div>`)});}
function claimsPanel(){const d=sheet('Claim Archive','Living Claims fight beside you. Item Claims become manifested equipment.');d.querySelector('.sheet').insertAdjacentHTML('beforeend',`<div class="listItem"><strong>Active Manifest Squad · ${state.squad.length}/3</strong><p>All assigned manifestations deploy automatically when combat starts.</p></div>`);if(!state.claims.length)d.querySelector('.sheet').insertAdjacentHTML('beforeend','<div class="listItem"><p>No living templates yet. Defeat enemies and Claim them after battle.</p></div>');state.claims.forEach(id=>{const t=TEMPLATES[id],on=state.squad.includes(id);d.querySelector('.sheet').insertAdjacentHTML('beforeend',`<div class="listItem"><div class="npcRow"><div class="npcPortrait">${t.icon}</div><div><strong>${t.name}</strong> <span class="pill">${t.rarity}</span><p>HP ${t.stats.hp} · ATK ${t.stats.atk} · DEF ${t.stats.def} · SPD ${t.stats.spd}</p></div></div><div class="miniBtns"><button class="miniBtn ${on?'active':''}" data-squad="${id}">${on?'Remove Squad':'Assign Squad'}</button>${t.moves.map(m=>`<button class="miniBtn ${state.channel===m?'active':''}" data-channel="${m}">${MOVES[m].name}</button>`).join('')}</div></div>`)});d.querySelector('.sheet').insertAdjacentHTML('beforeend',`<div class="sep"></div><div class="listItem"><strong>Claimed Objects · ${state.itemClaims.length}</strong><p>Equip up to two manifested item templates.</p></div>`);if(!state.itemClaims.length)d.querySelector('.sheet').insertAdjacentHTML('beforeend','<div class="listItem"><p>Explore and investigate to find claimable equipment.</p></div>');state.itemClaims.forEach(id=>{const it=CLAIM_ITEMS[id],on=state.equippedItems.includes(id);d.querySelector('.sheet').insertAdjacentHTML('beforeend',`<div class="listItem"><div class="npcRow"><div class="gearIcon">${it.icon}</div><div><strong>${it.name}</strong> <span class="pill">${it.rarity}</span><p>${it.desc}</p></div></div><button class="miniBtn ${on?'active':''}" data-equipitem="${id}">${on?'Unequip':'Equip Manifested Copy'}</button></div>`)});d.querySelectorAll('[data-squad]').forEach(x=>x.onclick=()=>{const id=x.dataset.squad;if(state.squad.includes(id))state.squad=state.squad.filter(v=>v!==id);else if(state.squad.length<3)state.squad.push(id);else return toast('Squad full');save();d.remove();claimsPanel()});d.querySelectorAll('[data-channel]').forEach(x=>x.onclick=()=>{state.channel=x.dataset.channel;toast('Channel: '+MOVES[state.channel].name);save();d.remove();claimsPanel()});d.querySelectorAll('[data-equipitem]').forEach(x=>x.onclick=()=>{const id=x.dataset.equipitem;if(state.equippedItems.includes(id))state.equippedItems=state.equippedItems.filter(v=>v!==id);else if(state.equippedItems.length<2)state.equippedItems.push(id);else return toast('Two item slots max');save();d.remove();claimsPanel()})}
function bagPanel(){const d=sheet('Gear & Archive Data','Consumables are separate from Claim templates.');Object.entries(ITEMS).forEach(([id,it])=>d.querySelector('.sheet').insertAdjacentHTML('beforeend',`<div class="listItem"><strong>${it.name} × ${state.inventory[id]||0}</strong><p>${it.desc}</p>${id!=='smokeCharge'?`<button class="miniBtn" data-useout="${id}" ${(state.inventory[id]||0)<=0?'disabled':''}>Use Now</button>`:''}</div>`));d.querySelector('.sheet').insertAdjacentHTML('beforeend',`<div class="sep"></div><div class="listItem"><strong>Equipped Claimed Objects</strong><p>${state.equippedItems.map(id=>'• '+CLAIM_ITEMS[id].name).join('<br>')||'None equipped.'}</p></div><div class="listItem"><strong>Archive Intel · ${state.discoveries.length}</strong><p>${state.discoveries.slice(0,7).map(x=>'• '+x.name).join('<br>')||'No discoveries yet.'}</p></div><div class="listItem"><strong>Recent Activity</strong><p>${state.feed.slice(0,8).map(x=>'• '+x.text).join('<br>')}</p></div>`);d.querySelectorAll('[data-useout]').forEach(x=>x.onclick=()=>{const id=x.dataset.useout;if((state.inventory[id]||0)<=0)return;state.inventory[id]--;if(id==='medPatch')state.player.hp=Math.min(state.player.hpMax,state.player.hp+35);if(id==='focusCell')state.claimEnergy=Math.min(state.claimEnergyMax,state.claimEnergy+30);save();toast(ITEMS[id].name+' used');d.remove();bagPanel()})}

render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
})();
</script>
</body>
