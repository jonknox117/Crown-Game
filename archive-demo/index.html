const fresh=()=>({version:2,screen:'archive',universe:null,city:null,location:null,lastResult:'',feed:[{t:Date.now(),text:'Archive systems online.'}],discoveries:[],metNPCs:[],quests:{},claims:[],squad:[],channel:null,inventory:{medPatch:2,focusCell:1,smokeCharge:1},resonance:0,claimEnergy:100,claimEnergyMax:100,player:{hp:100,hpMax:100,atk:18,def:16,spd:16},encounterMeter:0,actionsSinceEncounter:0,firstTalks:{},flags:{},battle:null,stats:{wins:0,losses:0,claims:0,encounters:0}});
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.version===2)return normalize(x)}catch(e){};let s=fresh();try{const old=JSON.parse(localStorage.getItem(OLDKEY));if(old){s.screen=old.screen||'archive';s.city=old.city||null;s.location=old.location||null;s.universe=old.universe||null;s.discoveries=old.discoveries||[];s.feed=(old.feed||s.feed).slice(0,30)}}catch(e){}return s}
function normalize(s){const f=fresh();s={...f,...s};s.player={...f.player,...(s.player||{})};s.inventory={...f.inventory,...(s.inventory||{})};s.flags={...f.flags,...(s.flags||{})};s.stats={...f.stats,...(s.stats||{})};s.firstTalks=s.firstTalks||{};s.claims=s.claims||[];s.squad=s.squad||[];s.quests=s.quests||{};return s}

function log(text){state.feed.unshift({t:Date.now(),text});state.feed=state.feed.slice(0,45);save()}
function toast(text){const d=document.createElement('div');d.className='toast';d.textContent=text;document.body.appendChild(d);setTimeout(()=>d.remove(),1900)}
function addDisc(id,name,type='Intel'){if(state.discoveries.some(d=>d.id===id))return false;state.discoveries.unshift({id,name,type,t:Date.now()});toast('Discovery: '+name);return true}
function questState(id){if(!state.quests[id])state.quests[id]={status:'inactive',progress:{}};return state.quests[id]}
function startQuest(id){const q=QUESTS[id],qs=questState(id);if(qs.status!=='inactive')return;qs.status='active';q.steps.forEach(s=>qs.progress[s.id]=qs.progress[s.id]||0);log('Quest accepted: '+q.name);toast('Quest accepted: '+q.name);save()}
function questProgress(event,amount=1){let changed=false;Object.entries(state.quests).forEach(([id,qs])=>{if(qs.status!=='active')return;const q=QUESTS[id];const step=q.steps.find(s=>s.id===event);if(!step)return;qs.progress[event]=clamp((qs.progress[event]||0)+amount,0,step.need);changed=true;const done=q.steps.every(s=>(qs.progress[s.id]||0)>=s.need);if(done){qs.status='complete';state.resonance+=q.reward.res||0;if(q.reward.item)state.inventory[q.reward.item]=(state.inventory[q.reward.item]||0)+(q.reward.qty||1);log('Quest complete: '+q.name);toast('Quest complete: '+q.name)}});if(changed)save()}
function hasQuest(id,status){return state.quests[id]?.status===status}
function hasClaim(id){return state.claims.includes(id)}

if(kind==='gotham')return `<svg viewBox="0 0 700 238" preserveAspectRatio="none"><rect width="700" height="238" fill="#101828"/><circle cx="560" cy="52" r="28" fill="#aab8cf" opacity=".35"/><path d="M0 170L65 122l40 28 52-82 47 90 72-122 58 129 63-86 58 92 45-46 54 45 46-84 70 92v60H0z" fill="#0a0e17"/><g stroke="#76a7ff" opacity=".24">${Array.from({length:18},(_,i)=>`<path d="M${i*43} -10l-70 260"/>`).join('')}</g></svg>`;
return `<svg viewBox="0 0 700 238" preserveAspectRatio="none"><defs><linearGradient id="m" x2="0" y2="1"><stop stop-color="#4d91da"/><stop offset=".7" stop-color="#91c4ee"/></linearGradient></defs><rect width="700" height="238" fill="url(#m)"/><circle cx="585" cy="46" r="30" fill="#fff1b4" opacity=".82"/><path d="M0 190h700v48H0z" fill="#182236"/><path d="M55 190V90h65v100M145 190V56h80v134M250 190V110h60v80M338 190V42h78v148M445 190V82h72v108M545 190V62h96v128" fill="#263b5a"/><g fill="#f6d67a" opacity=".7">${Array.from({length:22},(_,i)=>`<rect x="${66+(i%6)*91}" y="${75+(i%4)*25}" width="7" height="9"/>`).join('')}</g></svg>`}

function render(){document.body.className=state.city?CITY[state.city].theme:'archiveGlow';if(state.screen==='combat')return renderCombat();app.innerHTML=header()+`<main class="main">${state.screen==='archive'?archiveView():state.screen==='portal'?portalView():state.screen==='city'?cityView():locationView()}</main>`+nav();bindCommon();save()}

function encounterOdds(action){let base=.38+state.encounterMeter/250;if(action==='Talk')base+=.12;if(action==='Investigate')base+=.08;if(state.actionsSinceEncounter>=3)base+=.2;return clamp(base,.3,.86)}
function locationView(){const l=CITY[state.city].locations[state.location];const odds=Math.round(encounterOdds('Observe')*100);return `<section class="scene">${sceneSvg(state.city==='gotham'?'gotham':'metro')}<div class="sceneShade"></div><div class="sceneText"><div class="eyebrow">${CITY[state.city].name}</div><div class="sceneTitle">${l.name}</div><div class="sceneSub">${l.desc}</div></div></section>

function actionHint(a){return ({Observe:'Survey people, movement, and obvious changes.',Explore:'Push deeper into the district.',Talk:'Approach someone and see who answers.',Investigate:'Actively search for leads and anomalies.',Listen:'Monitor chatter, scanners, and conversations.',Browse:'Check public systems and available records.'})[a]||'Interact with the scene.'}
function bindCommon(){document.querySelectorAll('[data-go="portal"]').forEach(b=>b.onclick=()=>{state.screen='portal';render()});document.querySelectorAll('[data-universe]').forEach(b=>b.onclick=()=>{state.universe='dc';state.screen='city';state.city=state.city||'gotham';state.location=null;render()});document.querySelectorAll('[data-location]').forEach(b=>b.onclick=()=>{state.location=b.dataset.location;state.screen='location';state.lastResult='';render()});document.querySelectorAll('[data-switchcity]').forEach(b=>b.onclick=()=>{state.city=state.city==='gotham'?'metropolis':'gotham';state.location=null;state.screen='city';render()});document.querySelectorAll('[data-backcity]').forEach(b=>b.onclick=()=>{state.screen='city';state.location=null;state.lastResult='';render()});document.querySelectorAll('[data-home]').forEach(b=>b.onclick=goHome);document.querySelectorAll('[data-rest]').forEach(b=>b.onclick=()=>{state.player.hp=state.player.hpMax;state.claimEnergy=state.claimEnergyMax;log('Archive stabilization restored HP and Claim Energy.');toast('Fully restored');render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>worldAction(b.dataset.action));document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>openPanel(b.dataset.nav))}
function goHome(){state.screen='archive';state.city=null;state.location=null;state.lastResult='';state.encounterMeter=0;state.player.hp=state.player.hpMax;state.claimEnergy=state.claimEnergyMax;log('Returned to the Archive.');render()}

const flavor={
 gotham:{central:['A patrol car returns with a shattered rear window. Nobody explains it.','Two detectives hurry out with coffee abandoned on the desk behind them.'],narrows:['A rooftop silhouette disappears when lightning brightens the block.','A shop gate slams shut half a block ahead of you.'],docks:['A crane stops mid-lift while three workers stare toward warehouse twelve.','One freighter runs completely dark while every ship around it shows deck lights.'],wayne:['A black executive car exits Wayne Tower without an escort.','Several rooftop cameras are newer than the systems beneath them.']},
 metropolis:{planet:['Half the plaza looks upward at once. Phones come out too late.','A reporter runs out of the Planet while still typing on a tablet.'],park:['A sonic boom rolls far above the skyline, then fades.','Two children argue about whether a distant red streak was Superman.'],star:['A security door cycles twice before accepting a badge it already accepted.','Technicians move a scorched drone chassis behind privacy glass.'],southside:['A truck unloads sealed crates with no company markings.','Three lookouts rotate positions with practiced timing.']}
};
function worldAction(action){const l=CITY[state.city].locations[state.location];state.actionsSinceEncounter++;state.encounterMeter=clamp(state.encounterMeter+Math.floor(13+Math.random()*18),0,100);
 // guaranteed first meaningful talk at quest hubs
 const firstKey=state.city+'_'+state.location;
 if(action==='Talk'&&!state.firstTalks[firstKey]&&l.npcs.length){state.firstTalks[firstKey]=true;return encounterNPC(l.npcs[0]);}
 const roll=Math.random(), eventChance=encounterOdds(action);
 if(roll>eventChance){const text=rand(flavor[state.city][state.location]);state.lastResult=`<span class="tag">Scene</span>${text}`;if(chance(.35)){const id='intel_'+state.city+'_'+state.location+'_'+Math.floor(Math.random()*4);if(addDisc(id,'Local Pattern: '+l.name,'Observation'))state.lastResult+=`<br><br><strong>Useful:</strong> You add the pattern to your Archive index.`}save();return render()}
 // event type weighted by action
 let r=Math.random();if(action==='Talk')r-=.18;if(action==='Investigate')r+=.08;
 if(r<.28&&l.npcs.length)return encounterNPC(rand(l.npcs));
 if(r<.66)return encounterCombat(pickEnemy(l));
 if(r<.86)return infoEvent(action);
 return itemEvent();
}
function pickEnemy(l){let pool=[...l.pool];if(state.location==='docks'&&!hasQuest('missingEvidence','active')&&!hasQuest('redHoodCargo','active'))pool=pool.filter(x=>x!=='killerCroc');if(state.location==='narrows'&&!hasQuest('voltageTrail','active'))pool=pool.filter(x=>x!=='electrocutioner');return rand(pool.length?pool:l.pool)}
function resetPressure(){state.actionsSinceEncounter=0;state.encounterMeter=Math.max(0,state.encounterMeter-55)}
function infoEvent(action){const city=state.city,loc=state.location;let text='You connect several small details into something useful.';let event=null,disc=null;
 if(city==='gotham'&&loc==='docks'){if(hasQuest('missingEvidence','active')&&!questStepDone('missingEvidence','dock_clue')){event='dock_clue';text='A broken evidence seal is wedged behind a loading brace. The serial matches Montoya’s missing shipment.'}else if(hasQuest('redHoodCargo','active')&&!questStepDone('redHoodCargo','dock_manifest')){event='dock_manifest';text='You find a transfer manifest hidden inside a forklift maintenance panel. Several destinations are shell companies.'}else{text='A container seal was cut and carefully glued back together. Someone expected only a visual inspection.';disc=['tampered_cargo','Tampered Cargo Network','Evidence']}}
 else if(city==='gotham'&&loc==='narrows'&&hasQuest('voltageTrail','active')&&!questStepDone('voltageTrail','narrows_arc')){event='narrows_arc';text='The scorch marks are staged. The real current bled into a utility conduit two blocks east—exactly the trick Nightwing warned you about.'}
 else if(city==='metropolis'&&loc==='southside'&&hasQuest('intergangSource','active')&&!questStepDone('intergangSource','southside_clue')){event='southside_clue';text='Alien-energy residue and fresh tire marks converge on a warehouse with a fake recycling permit. This is the exchange site.'}
 else if(city==='metropolis'&&loc==='star'&&hasQuest('steelSignal','active')&&!questStepDone('steelSignal','star_signal')){event='star_signal';text='The rogue drone signal is piggybacking on a public calibration beacon. Someone wanted the source to look like S.T.A.R. Labs itself.'}
 else {const generic={gotham:['A camera blind spot lines up perfectly with a roof access route.','You identify a pattern in patrol gaps that someone else has also noticed.'],metropolis:['A burst of encrypted traffic lines up with the last unusual power fluctuation.','You spot scorch marks from a weapon that is definitely not standard street hardware.']};text=rand(generic[city]);disc=['intel_'+uid(),'Actionable '+CITY[city].locations[loc].name+' Intel','Intel']}
 if(event)questProgress(event);if(disc)addDisc(...disc);state.lastResult=`<span class="tag">Useful Intel</span>${text}`;resetPressure();save();render()}
function itemEvent(){const ids=Object.keys(ITEMS),id=rand(ids);state.inventory[id]=(state.inventory[id]||0)+1;state.lastResult=`<span class="tag">Find</span>You recover <strong>${ITEMS[id].name}</strong>. ${ITEMS[id].desc}`;log('Found '+ITEMS[id].name+'.');resetPressure();save();render()}
function questStepDone(q,e){const qs=state.quests[q];const st=QUESTS[q].steps.find(s=>s.id===e);return qs&&(qs.progress[e]||0)>=st.need}

function npcQuest(npc){if(npc==='montoya')return 'missingEvidence';if(npc==='nightwing')return 'voltageTrail';if(npc==='redhood')return 'redHoodCargo';if(npc==='lois')return 'intergangSource';if(npc==='steel')return 'steelSignal';return null}
function encounterNPC(id){resetPressure();state.stats.encounters++;if(!state.metNPCs.includes(id))state.metNPCs.push(id);const n=NPCS[id],qid=npcQuest(id);if(qid)questProgress('talk_'+id);log('Encountered '+n.name+'.');save();openNPC(id,qid)}
function openNPC(id,qid){const n=NPCS[id],q=qid&&QUESTS[qid],qs=qid&&questState(qid);let qBlock='';if(q){if(qs.status==='inactive')qBlock=`<div class="dialogue"><strong>${q.name}</strong><br>${q.desc}</div><div class="miniBtns"><button class="miniBtn active" data-acceptq="${qid}">Accept Quest</button><button class="miniBtn" data-dismissnpc>Not now</button></div>`;else if(qs.status==='active')qBlock=`<div class="dialogue"><strong>Quest active: ${q.name}</strong><br>${currentObjective(qid)}</div>`;else qBlock=`<div class="dialogue"><strong>${q.name} — complete</strong><br>${q.completion}</div>`}
 const div=document.createElement('div');div.className='overlay';div.innerHTML=`<div class="sheet"><div class="sheetHead"><h2>Character Encounter</h2><button class="close">×</button></div><div class="npcRow"><div class="npcPortrait">${n.icon}</div><div><h3>${n.name}</h3><p>${n.role}</p></div></div><div class="dialogue">${n.intro}<br><br><strong>${rand(n.lines)}</strong></div>${qBlock}<div class="miniBtns"><button class="miniBtn" data-npcask="intel">Ask what they know</button><button class="miniBtn" data-npcask="you">Explain your ability</button><button class="miniBtn" data-dismissnpc>Leave</button></div></div>`;document.body.appendChild(div);div.querySelector('.close').onclick=()=>{div.remove();render()};div.querySelectorAll('[data-dismissnpc]').forEach(b=>b.onclick=()=>{div.remove();state.lastResult=`<span class="tag">Named Encounter</span>You met <strong>${n.name}</strong>.`;render()});div.querySelectorAll('[data-acceptq]').forEach(b=>b.onclick=()=>{startQuest(b.dataset.acceptq);questProgress('talk_'+id);div.remove();render()});div.querySelectorAll('[data-npcask]').forEach(b=>b.onclick=()=>{const type=b.dataset.npcask;const line=type==='intel'?npcIntel(id):npcReaction(id);div.querySelector('.dialogue').innerHTML=`<strong>${n.name}</strong><br>${line}`})}
function npcIntel(id){const x={montoya:'“The docks. Start with shipping seals and anything that looks too carefully repaired.”',gordon:'“Look for patterns, not rumors. Gotham manufactures rumors by the hour.”',nightwing:'“Watch the rooftops and the power grid. The loudest clue is probably bait.”',redhood:'“Crates are moving through warehouse twelve. Anybody pretending they are normal freight is lying.”',catwoman:'“Wayne Tower has security inside security. Interesting, isn’t it?”',batman:'“Your safest advantage is information. Use it before you use force.”',lois:'“Southside. Warehouse district. Men with expensive guns and very cheap cover stories.”',jimmy:'“Intergang guys keep showing up in photos near the same freight route.”',steel:'“Alien weapons leave a very specific energy signature. Follow the residue, not the casing.”',superman:'“If a situation escalates beyond you, getting civilians out is still a win.”'};addDisc('npc_'+id,'Intel from '+NPCS[id].name,'Character Intel');save();return x[id]||'They give you a useful local lead.'}
function npcReaction(id){const x={batman:'“I understand what you claim it can do. That does not answer what you intend to do with it.”',redhood:'“So you beat somebody, copy them, and then you can bring your version back out? Yeah. That is not unsettling at all.”',superman:'“Power that can reproduce people deserves care. The choices around it matter as much as the capability.”',lois:'“That is either the story of the century or a reason never to put my notebook down again.”',nightwing:'“That explains why you keep looking at people like character-select screens.”'};return x[id]||'They listen carefully, clearly recalculating what you are capable of.'}
function currentObjective(id){const q=QUESTS[id],qs=state.quests[id];const s=q.steps.find(st=>(qs.progress[st.id]||0)<st.need);return s?'Current objective: '+s.text:'All objectives complete.'}

function encounterCombat(templateId){resetPressure();state.stats.encounters++;const t=TEMPLATES[templateId];const enemy={templateId,name:t.name,hp:t.stats.hp,maxHp:t.stats.hp,atk:t.stats.atk,def:t.stats.def,spd:t.stats.spd,status:{},guard:0,evade:0};const p={form:'jon',templateId:null,name:'Jon',hp:state.player.hp,maxHp:state.player.hpMax,atk:state.player.atk,def:state.player.def,spd:state.player.spd,status:{},guard:0,evade:0,moves:baseMoves(),manifestHp:{}};state.battle={id:uid(),enemy,player:p,allyHp:Object.fromEntries(state.squad.map(id=>[id,TEMPLATES[id].stats.hp])),turn:1,log:`A hostile <strong>${t.name}</strong> confronts you.`,result:null,claimed:false,canClaim:false};state.screen='combat';log('Combat encounter: '+t.name+'.');save();render()}
function baseMoves(){const a=['strike','guard','sovereignPulse'];if(state.channel&&MOVES[state.channel])a.push(state.channel);else a.push('repulsor');return a}
function fighterTemplate(id,hpRatio=1){const t=TEMPLATES[id];return {form:'template',templateId:id,name:t.name,hp:Math.max(1,Math.round(t.stats.hp*hpRatio)),maxHp:t.stats.hp,atk:t.stats.atk,def:t.stats.def,spd:t.stats.spd,status:{},guard:0,evade:0,moves:[...t.moves],manifestHp:{}}}
function renderCombat(){const b=state.battle;if(!b){state.screen='location';return render()}const e=b.enemy,p=b.player,et=TEMPLATES[e.templateId];app.innerHTML=header()+`<main class="combatWrap"><div class="battlefield"><div class="combatant enemy"><div class="nameLine"><strong>${et.name}</strong><span>${et.rarity}</span></div>${hpUI(e)}<div class="statusRow">${statusUI(e)}</div></div><div class="combatant player"><div class="nameLine"><strong>${p.name}</strong><span>${p.form==='jon'?'BASE':p.form==='transform'?'TRANSFORM':'MANIFESTATION'}</span></div>${hpUI(p)}<div class="statusRow">${statusUI(p)}</div></div><div class="battleLog">${b.log}</div></div>
${b.result==='victory'?victoryUI():b.result==='defeat'?defeatUI():`<div class="section"><div class="sectionTitle"><h2>Moves</h2><span>Turn ${b.turn}</span></div><div class="moves">${p.moves.map(id=>moveButton(id)).join('')}</div></div><div class="section"><div class="combatTools"><button class="btn" data-combattool="transform">Transform</button><button class="btn" data-combattool="manifest">Manifest</button><button class="btn" data-combattool="item">Item</button><button class="btn" data-combattool="flee">Flee</button></div></div>`}</main>`;bindCombat();save()}
function hpUI(c){const per=pct(c.hp,c.maxHp);return `<div class="hpbar ${per<30?'low':''}"><i style="width:${per}%"></i></div><div class="hpText"><span>HP</span><span>${Math.max(0,c.hp)} / ${c.maxHp}</span></div>`}
function statusUI(c){return Object.entries(c.status||{}).filter(([,v])=>v>0).map(([k])=>`<span class="pill danger">${k}</span>`).join('')+(c.evade>0?'<span class="pill blue">evasive</span>':'')}
function moveButton(id){const m=MOVES[id];if(!m)return '';return `<button class="moveBtn" data-move="${id}"><strong>${m.name}</strong><small>${m.desc}</small><div class="moveMeta"><span>${m.type}</span><span>${m.power?m.power+' PWR':'TACTIC'}</span><span>${m.acc}% ACC</span></div></button>`}
function bindCombat(){document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>playerMove(b.dataset.move));document.querySelectorAll('[data-combattool]').forEach(b=>b.onclick=()=>combatTool(b.dataset.combattool));document.querySelectorAll('[data-claimtarget]').forEach(b=>b.onclick=claimDefeated);document.querySelectorAll('[data-finishbattle]').forEach(b=>b.onclick=finishBattle);document.querySelectorAll('[data-homeafterloss]').forEach(b=>b.onclick=()=>{state.battle=null;goHome()})}
function moveDamage(att,def,m){if(!m.power)return 0;let dmg=m.power*(att.atk/Math.max(6,def.def))*0.72*(.88+Math.random()*.22);if(def.guard){dmg*=def.guard===2?.35:.55}if(m.hits)dmg*=m.hits*.63;return Math.max(2,Math.round(dmg))}
function actMove(actor,target,id,isPlayer){const m=MOVES[id];if(actor.status.stun>0&&chance(.55)){actor.status.stun--;return `${actor.name} is stunned and loses the action.`}if(actor.status.slow>0)actor.status.slow--;if(target.evade>0&&chance(.36)){target.evade--;return `${target.name} slips away from ${m.name}.`}if(Math.random()*100>m.acc)return `${actor.name}'s ${m.name} misses.`;if(m.effect==='guard'){actor.guard=1;return `${actor.name} braces. Incoming damage is reduced.`}if(m.effect==='guardStrong'){actor.guard=2;return `${actor.name} hardens up for the next impact.`}if(m.effect==='evade'){actor.evade=2;return `${actor.name} disappears into a better angle.`}const dmg=moveDamage(actor,target,m);target.hp=Math.max(0,target.hp-dmg);let txt=`${actor.name} uses <strong>${m.name}</strong> for <strong>${dmg}</strong> damage.`;if(m.status&&chance(m.statusChance)){target.status[m.status]=m.status==='bleed'?3:m.status==='slow'?3:2;txt+=` ${target.name} is ${m.status}.`}return txt}
function endTurnStatus(c){let txt='';if(c.status.bleed>0){const d=Math.max(3,Math.round(c.maxHp*.06));c.hp=Math.max(0,c.hp-d);c.status.bleed--;txt+=` ${c.name} takes ${d} bleed damage.`}if(c.guard)c.guard=0;if(c.evade>0)c.evade--;return txt}
function enemyMove(){const e=state.battle.enemy,t=TEMPLATES[e.templateId];let moves=t.moves;if(e.hp/e.maxHp<.33&&moves.includes('guard')&&chance(.28))return 'guard';return rand(moves.filter(m=>m!=='guard'||chance(.45)))}
function playerMove(id){const b=state.battle;if(b.result)return;const p=b.player,e=b.enemy;const em=enemyMove();let logParts=[];const playerFirst=(p.spd-(p.status.slow?5:0))>=(e.spd-(e.status.slow?5:0));if(playerFirst){logParts.push(actMove(p,e,id,true));if(e.hp>0)logParts.push(actMove(e,p,em,false))}else{logParts.push(actMove(e,p,em,false));if(p.hp>0)logParts.push(actMove(p,e,id,true))}logParts.push(endTurnStatus(p));logParts.push(endTurnStatus(e));b.log=logParts.filter(Boolean).join('<br>');b.turn++;checkBattleEnd();save();render()}
function checkBattleEnd(){const b=state.battle;if(b.enemy.hp<=0){b.result='victory';b.canClaim=true;state.stats.wins++;const reward=10+Math.floor(TEMPLATES[b.enemy.templateId].cost*.45);state.resonance+=reward;if(b.player.form==='jon')state.player.hp=Math.max(1,b.player.hp);else if(b.player.form==='transform')state.player.hp=Math.max(1,Math.round(state.player.hpMax*(b.player.hp/b.player.maxHp)));const map={blackMaskEnforcer:'beat_blackmask',penguinGunman:'beat_penguin',electrocutioner:'beat_electrocutioner',intergangHeavy:'beat_intergangheavy',lexDrone:'beat_lexdrone'};if(map[b.enemy.templateId])questProgress(map[b.enemy.templateId]);log('Victory over '+TEMPLATES[b.enemy.templateId].name+'.');return}if(b.player.hp<=0){if(b.player.form==='manifest'){b.allyHp[b.player.templateId]=0;b.player={form:'jon',templateId:null,name:'Jon',hp:Math.max(1,state.player.hp),maxHp:state.player.hpMax,atk:state.player.atk,def:state.player.def,spd:state.player.spd,status:{},guard:0,evade:0,moves:baseMoves(),manifestHp:{}};b.log+='<br><strong>The manifestation breaks apart.</strong> Jon takes the field.';return}b.result='defeat';state.stats.losses++;state.resonance=Math.max(0,state.resonance-10);state.player.hp=1;log('Defeated by '+TEMPLATES[b.enemy.templateId].name+'.')}}
function victoryUI(){const b=state.battle,t=TEMPLATES[b.enemy.templateId],claimed=hasClaim(b.enemy.templateId),can=state.claimEnergy>=t.cost;return `<div class="section"><div class="victory"><h2>Victory</h2><p>${t.name} is down. You can leave, or spend Claim Energy to record a complete Sovereign template.</p><div class="stats"><div class="stat"><b>+${10+Math.floor(t.cost*.45)}</b><span>Resonance</span></div><div class="stat"><b>${t.cost}</b><span>Claim Cost</span></div><div class="stat"><b>${t.stats.hp}</b><span>Template HP</span></div><div class="stat"><b>${t.rarity}</b><span>Class</span></div></div><div class="grid two" style="margin-top:12px"><button class="btn ${can&&!claimed?'primary':''}" data-claimtarget ${claimed||!can?'disabled':''}>${claimed?'Already Claimed':can?'Claim Defeated Target':'Not Enough Claim Energy'}</button><button class="btn" data-finishbattle>Leave Encounter</button></div></div></div>`}
function defeatUI(){return `<div class="section"><div class="victory" style="border-color:rgba(255,105,123,.28)"><h2>Defeated</h2><p>The Archive anchor catches you before the situation becomes terminal. You lose 10 Resonance and return injured.</p><button class="btn danger" data-homeafterloss>Return to Archive</button></div></div>`}
function claimDefeated(){const b=state.battle,t=TEMPLATES[b.enemy.templateId];if(hasClaim(b.enemy.templateId)||state.claimEnergy<t.cost)return;state.claimEnergy-=t.cost;state.claims.push(b.enemy.templateId);state.stats.claims++;b.claimed=true;log('Claimed template: '+t.name+'.');toast(t.name+' added to Archive');save();render()}
function finishBattle(){const b=state.battle;if(b.player.form==='jon')state.player.hp=Math.max(1,b.player.hp);else if(b.player.form==='transform')state.player.hp=Math.max(1,Math.round(state.player.hpMax*(b.player.hp/b.player.maxHp)));state.battle=null;state.screen='location';state.lastResult=`<span class="tag">Combat Victory</span>You defeated <strong>${TEMPLATES[b.enemy.templateId].name}</strong>${b.claimed?' and secured its full template.':'.'}`;render()}
function combatTool(type){if(type==='flee'){const e=state.battle.enemy,p=state.battle.player;const odds=.45+(p.spd-e.spd)*.015;if(chance(clamp(odds,.18,.85))){state.battle=null;state.screen='location';state.lastResult='<span class="tag">Escaped</span>You break contact and leave the encounter.';return render()}state.battle.log='You fail to disengage. '+actMove(e,p,enemyMove(),false);state.battle.turn++;checkBattleEnd();return render()}if(type==='transform')return transformPanel();if(type==='manifest')return manifestPanel();if(type==='item')return battleItemPanel()}
function transformPanel(){if(!state.claims.length)return toast('No claimed templates yet');const d=sheet('Transform','Jon copies the selected template’s exact combat stats and moves for this battle.');d.querySelector('.sheet').insertAdjacentHTML('beforeend',state.claims.map(id=>claimChoiceHTML(id,'transform')).join(''));d.querySelectorAll('[data-transform]').forEach(b=>b.onclick=()=>{const id=b.dataset.transform,old=state.battle.player,ratio=old.hp/old.maxHp,n=fighterTemplate(id,ratio);n.form='transform';n.name='Jon — '+TEMPLATES[id].name;state.battle.player=n;state.battle.log=`Jon transforms into an exact copy of <strong>${TEMPLATES[id].name}</strong>.`;d.remove();render()})}
function manifestPanel(){if(!state.squad.length)return toast('Add claims to your squad first');const btl=state.battle,d=sheet('Manifest','Switch the active combatant. Damage to each manifestation persists for this encounter.');let rows=`<div class="listItem"><strong>Jon</strong><p>Recall the active manifestation and return Jon to the fight.</p><button class="miniBtn" data-manifestjon>Use Jon</button></div>`;rows+=state.squad.map(id=>{const t=TEMPLATES[id],hp=btl.allyHp[id]??t.stats.hp;return `<div class="listItem"><div class="npcRow"><div class="npcPortrait">${t.icon}</div><div><strong>${t.name}</strong><p>HP ${hp}/${t.stats.hp} · ATK ${t.stats.atk} · DEF ${t.stats.def} · SPD ${t.stats.spd}</p></div></div><div class="miniBtns"><button class="miniBtn" data-manifest="${id}" ${hp<=0?'disabled':''}>${hp<=0?'Disrupted':'Manifest'}</button></div></div>`}).join('');d.querySelector('.sheet').insertAdjacentHTML('beforeend',rows);d.querySelector('[data-manifestjon]').onclick=()=>{const old=btl.player;if(old.form==='manifest')btl.allyHp[old.templateId]=old.hp;if(old.form==='transform')state.player.hp=Math.max(1,Math.round(state.player.hpMax*(old.hp/old.maxHp)));btl.player={form:'jon',templateId:null,name:'Jon',hp:Math.max(1,state.player.hp),maxHp:state.player.hpMax,atk:state.player.atk,def:state.player.def,spd:state.player.spd,status:{},guard:0,evade:0,moves:baseMoves(),manifestHp:{}};d.remove();render()};d.querySelectorAll('[data-manifest]').forEach(btn=>btn.onclick=()=>{const old=btl.player;if(old.form==='manifest')btl.allyHp[old.templateId]=old.hp;if(old.form==='transform')state.player.hp=Math.max(1,Math.round(state.player.hpMax*(old.hp/old.maxHp)));const id=btn.dataset.manifest,hp=btl.allyHp[id]??TEMPLATES[id].stats.hp;btl.player=fighterTemplate(id,hp/TEMPLATES[id].stats.hp);btl.player.form='manifest';btl.log=`You manifest <strong>${TEMPLATES[id].name}</strong> as the active fighter.`;d.remove();render()})}
function battleItemPanel(){const d=sheet('Combat Gear','Using an item takes your action; the enemy still acts.');Object.entries(ITEMS).forEach(([id,it])=>{d.querySelector('.sheet').insertAdjacentHTML('beforeend',`<div class="listItem"><strong>${it.name} × ${state.inventory[id]||0}</strong><p>${it.desc}</p><button class="miniBtn" data-usebattle="${id}" ${(state.inventory[id]||0)<=0?'disabled':''}>Use</button></div>`)});d.querySelectorAll('[data-usebattle]').forEach(b=>b.onclick=()=>{useBattleItem(b.dataset.usebattle);d.remove()})}
function useBattleItem(id){if((state.inventory[id]||0)<=0)return;const p=state.battle.player,e=state.battle.enemy;state.inventory[id]--;let txt='';if(id==='medPatch'){const before=p.hp;p.hp=Math.min(p.maxHp,p.hp+35);txt=`${p.name} restores ${p.hp-before} HP.`}if(id==='focusCell'){state.claimEnergy=Math.min(state.claimEnergyMax,state.claimEnergy+30);txt='Claim Energy restored by 30.'}if(id==='smokeCharge'){p.evade=3;txt=`${p.name} disappears into smoke.`}if(e.hp>0)txt+='<br>'+actMove(e,p,enemyMove(),false);state.battle.log=txt;state.battle.turn++;checkBattleEnd();save();render()}

function sheet(title,sub=''){const d=document.createElement('div');d.className='overlay';d.innerHTML=`<div class="sheet"><div class="sheetHead"><div><h2>${title}</h2>${sub?`<div class="tip">${sub}</div>`:''}</div><button class="close">×</button></div></div>`;document.body.appendChild(d);d.querySelector('.close').onclick=()=>d.remove();d.onclick=e=>{if(e.target===d)d.remove()};return d}
function claimChoiceHTML(id,mode){const t=TEMPLATES[id];return `<div class="listItem"><div class="npcRow"><div class="npcPortrait">${t.icon}</div><div><strong>${t.name}</strong><p>HP ${t.stats.hp} · ATK ${t.stats.atk} · DEF ${t.stats.def} · SPD ${t.stats.spd}</p></div></div><div class="miniBtns"><button class="miniBtn" data-${mode}="${id}">${mode==='transform'?'Transform':'Manifest'}</button></div></div>`}
function openPanel(name){if(name==='world'){if(state.screen==='archive')return;return goHome()}if(name==='quests')return questsPanel();if(name==='claims')return claimsPanel();if(name==='bag')return bagPanel()}
function questsPanel(){const d=sheet('Quests','Named characters can offer multi-step objectives.');const ids=Object.keys(state.quests).filter(id=>state.quests[id].status!=='inactive');if(!ids.length)d.querySelector('.sheet').insertAdjacentHTML('beforeend','<div class="card"><p class="tip">No quests yet. Talk to named characters in Gotham or Metropolis.</p></div>');ids.forEach(id=>{const q=QUESTS[id],qs=state.quests[id];const done=q.steps.filter(s=>(qs.progress[s.id]||0)>=s.need).length;d.querySelector('.sheet').insertAdjacentHTML('beforeend',`<div class="listItem questGlow"><strong>${q.name} <span class="pill ${qs.status==='complete'?'good':'warn'}">${qs.status}</span></strong><p>${q.desc}</p><div class="questProgress"><small><span>${done}/${q.steps.length} objectives</span><span>${Math.round(done/q.steps.length*100)}%</span></small><div class="meter"><i style="width:${done/q.steps.length*100}%"></i></div></div>${q.steps.map(s=>`<p>${(qs.progress[s.id]||0)>=s.need?'✓':'○'} ${s.text}</p>`).join('')}</div>`)});}
function claimsPanel(){const d=sheet('Claim Archive','Claimed targets can be manifested, transformed into, or used as technique libraries. Squad limit: 3.');if(!state.claims.length)d.querySelector('.sheet').insertAdjacentHTML('beforeend','<div class="card"><p class="tip">Defeat an enemy in combat, then use Claim before leaving the encounter.</p></div>');state.claims.forEach(id=>{const t=TEMPLATES[id],inSquad=state.squad.includes(id);d.querySelector('.sheet').insertAdjacentHTML('beforeend',`<div class="listItem"><div class="npcRow"><div class="npcPortrait">${t.icon}</div><div><strong>${t.name}</strong> <span class="pill">${t.rarity}</span><p>HP ${t.stats.hp} · ATK ${t.stats.atk} · DEF ${t.stats.def} · SPD ${t.stats.spd}</p></div></div><div class="miniBtns"><button class="miniBtn ${inSquad?'active':''}" data-squad="${id}">${inSquad?'Remove from Squad':'Add to Squad'}</button>${t.moves.map(m=>`<button class="miniBtn ${state.channel===m?'active':''}" data-channel="${m}">${MOVES[m].name}</button>`).join('')}</div></div>`)});d.querySelectorAll('[data-squad]').forEach(b=>b.onclick=()=>{const id=b.dataset.squad;if(state.squad.includes(id))state.squad=state.squad.filter(x=>x!==id);else if(state.squad.length<3)state.squad.push(id);else return toast('Squad is full');save();d.remove();claimsPanel()});d.querySelectorAll('[data-channel]').forEach(b=>b.onclick=()=>{state.channel=b.dataset.channel;toast('Channel set: '+MOVES[state.channel].name);save();d.remove();claimsPanel()})}
function bagPanel(){const d=sheet('Gear & Archive Data','Items persist between encounters.');Object.entries(ITEMS).forEach(([id,it])=>d.querySelector('.sheet').insertAdjacentHTML('beforeend',`<div class="listItem"><strong>${it.name} × ${state.inventory[id]||0}</strong><p>${it.desc}</p>${id!=='smokeCharge'?`<button class="miniBtn" data-useout="${id}" ${(state.inventory[id]||0)<=0?'disabled':''}>Use Now</button>`:''}</div>`));d.querySelector('.sheet').insertAdjacentHTML('beforeend',`<div class="sep"></div><div class="listItem"><strong>Archive Intel: ${state.discoveries.length}</strong><p>${state.discoveries.slice(0,7).map(x=>'• '+x.name).join('<br>')||'No discoveries yet.'}</p></div><div class="listItem"><strong>Recent Activity</strong><p>${state.feed.slice(0,8).map(x=>'• '+x.text).join('<br>')}</p></div>`);d.querySelectorAll('[data-useout]').forEach(b=>b.onclick=()=>{const id=b.dataset.useout;if((state.inventory[id]||0)<=0)return;state.inventory[id]--;if(id==='medPatch')state.player.hp=Math.min(state.player.hpMax,state.player.hp+35);if(id==='focusCell')state.claimEnergy=Math.min(state.claimEnergyMax,state.claimEnergy+30);save();toast(ITEMS[id].name+' used');d.remove();bagPanel()})}

render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
})();
</script>
</body>
