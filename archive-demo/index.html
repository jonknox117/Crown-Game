<style>
:root{--bg:#080a10;--panel:rgba(15,18,29,.78);--line:rgba(255,255,255,.12);--text:#f3f4f7;--muted:#9fa7ba;--accent:#c8a86d;--good:#72d6a2;--danger:#ff6d7a;--shadow:0 20px 70px rgba(0,0,0,.42);--radius:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{overflow-x:hidden;background:radial-gradient(900px 540px at 50% -80px,rgba(117,99,255,.16),transparent 65%),linear-gradient(180deg,#090b12 0%,#07080d 100%)}button{font:inherit;color:inherit}#app{min-height:100svh;padding-bottom:calc(26px + env(safe-area-inset-bottom))}.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:linear-gradient(180deg,rgba(5,7,12,.94),rgba(5,7,12,.72));backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.07)}.brand{flex:1;min-width:0}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}.brand strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;margin-top:2px}.iconbtn{border:1px solid var(--line);background:rgba(255,255,255,.055);border-radius:13px;padding:10px 11px;min-width:43px;min-height:43px;display:grid;place-items:center;font-weight:800}.iconbtn:active{transform:scale(.97)}.main{width:min(780px,100%);margin:0 auto;padding:14px}.scene{position:relative;overflow:hidden;border-radius:26px;min-height:245px;border:1px solid rgba(255,255,255,.1);box-shadow:var(--shadow);background:#111523}.scene svg{display:block;width:100%;height:245px}.sceneShade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 28%,rgba(5,7,12,.25) 55%,rgba(5,7,12,.94) 100%)}.sceneText{position:absolute;left:18px;right:18px;bottom:17px}.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.68);font-weight:800}.sceneTitle{font-size:32px;line-height:.98;font-weight:900;letter-spacing:-.035em;margin:5px 0 7px}.sceneSub{color:rgba(255,255,255,.75);font-size:13px;line-height:1.35;max-width:540px}.section{margin-top:14px}.sectionTitle{display:flex;align-items:center;justify-content:space-between;margin:0 2px 8px}.sectionTitle h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:0;color:#cdd2df}.sectionTitle span{font-size:11px;color:var(--muted)}.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(26,30,44,.82),rgba(13,16,26,.9));border-radius:var(--radius);padding:16px;box-shadow:0 10px 35px rgba(0,0,0,.2)}.grid{display:grid;grid-template-columns:1fr;gap:10px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}@media(max-width:470px){.grid.two{grid-template-columns:1fr}}.choice{position:relative;width:100%;text-align:left;border:1px solid rgba(255,255,255,.11);border-radius:18px;padding:16px;background:linear-gradient(135deg,rgba(255,255,255,.075),rgba(255,255,255,.025));min-height:90px;overflow:hidden}.choice:active{transform:scale(.985)}.choice strong{font-size:17px;display:block;margin-bottom:5px}.choice p{margin:0;color:var(--muted);font-size:12px;line-height:1.35;padding-right:26px}.choice .arrow{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:20px;color:var(--accent)}.choice.locked{opacity:.46;filter:saturate(.35)}.choice.locked .arrow{color:var(--muted)}.pill{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:6px 9px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#d9deeb}.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--good);box-shadow:0 0 12px var(--good)}.primary{width:100%;border:1px solid rgba(200,168,109,.48);background:linear-gradient(135deg,rgba(200,168,109,.2),rgba(255,255,255,.04));border-radius:16px;padding:15px 16px;font-weight:850;text-align:center;min-height:52px}.primary:active,.secondary:active{transform:scale(.985)}.secondary{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.045);border-radius:15px;padding:13px 14px;font-weight:760;text-align:center;min-height:48px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:12px;border-radius:15px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035)}.stat b{display:block;font-size:15px}.stat span{display:block;color:var(--muted);font-size:9px;letter-spacing:.1em;text-transform:uppercase;margin-top:3px}.locationCard{display:flex;gap:12px;align-items:center}.locIcon{width:48px;height:48px;flex:0 0 48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.1);font-size:20px}.locationCard .meta{min-width:0;flex:1}.locationCard .meta strong{display:block;font-size:15px}.locationCard .meta span{display:block;margin-top:4px;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.action{min-height:54px;border-radius:15px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.035));font-weight:750;padding:12px}.action:active{transform:scale(.98)}.result{border-left:3px solid var(--accent);padding:12px 13px;background:rgba(255,255,255,.045);border-radius:4px 14px 14px 4px;color:#e3e7f0;font-size:13px;line-height:1.45;animation:fadeup .25s ease}@keyframes fadeup{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.overlay{position:fixed;z-index:50;inset:0;background:rgba(2,4,8,.72);backdrop-filter:blur(10px);display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(720px,100%);max-height:82svh;overflow:auto;border-radius:26px 26px 0 0;border:1px solid rgba(255,255,255,.13);border-bottom:0;background:#0d111c;padding:18px 16px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -30px 90px rgba(0,0,0,.55)}.sheetHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.sheetHead h2{margin:0;font-size:22px}.close{border:1px solid var(--line);background:rgba(255,255,255,.05);width:40px;height:40px;border-radius:13px;font-size:20px}.logItem{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07)}.logItem:last-child{border-bottom:0}.logItem strong{font-size:13px}.logItem p{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.4}.tag{display:inline-block;font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:850;margin-bottom:5px}.toast{position:fixed;z-index:80;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#171c2a;border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 40px rgba(0,0,0,.45);border-radius:14px;padding:11px 15px;font-size:12px;font-weight:700;animation:toast .25s ease;max-width:calc(100vw - 32px);text-align:center}.toast.good{border-color:rgba(114,214,162,.34)}@keyframes toast{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}.archiveGlow{--accent:#c8a86d}.gothamGlow{--accent:#6f9cff}.metroGlow{--accent:#f6ca68}.portalRing{transform-origin:350px 105px;animation:ring 9s linear infinite}@keyframes ring{to{transform:rotate(360deg)}}.rain{animation:rain 1.2s linear infinite}@keyframes rain{from{transform:translateY(-16px)}to{transform:translateY(18px)}}.saveLine{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:10px;margin-top:10px}.saveLine i{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 12px rgba(114,214,162,.7)}hr{border:0;border-top:1px solid rgba(255,255,255,.08);margin:14px 0}
</style>
</head>
<body><div id="app"></div>
<script>
(()=>{'use strict';
const KEY='sovereignArchiveDemo_v1';
const freshState=()=>({screen:'archive',universe:null,city:null,location:null,lastResult:'',discoveries:[],feed:[{t:Date.now(),text:'Archive systems online.'}],actionCounts:{},visits:{archive:1}});
let state=load();const app=document.getElementById('app');
const cityData={gotham:{name:'Gotham City',subtitle:'Rain. Stone. Sirens. Something is always moving in the dark.',theme:'gothamGlow',locations:{central:{name:'Gotham Central',icon:'◈',desc:'Police lights wash across wet stone. Radios chatter behind reinforced glass.',actions:{'Observe':{text:['A pair of detectives rush through the front doors. Whatever happened, it is fresh.','A patrol car returns with its rear window shattered. Nobody inside looks eager to explain.'],disc:['gcpd-tempo','GCPD Response Patterns','Intel']},'Listen to Scanner':{text:['A clipped dispatch mentions an abandoned vehicle near Ace Chemicals, then the channel changes.','Three units are redirected toward the Narrows. The dispatcher never says why.'],disc:['ace-mention','Ace Chemicals Mention','Lead']},'Talk':{text:['A tired officer tells you, “If you are sightseeing, pick another city.”','A desk sergeant gives you one hard look and points toward the public entrance.'],disc:null},'Investigate':{text:['Tire marks cut sharply across the curb—fast arrival, faster departure.','You notice the security cameras are all angled toward the same intersection.'],disc:['central-cameras','Central Camera Net','System']}}},narrows:{name:'The Narrows',icon:'⌁',desc:'Narrow streets, failing lights, shuttered storefronts. The city feels closer here.',actions:{'Observe':{text:['A rooftop silhouette vanishes the instant lightning brightens the block.','Nobody lingers in the open. Even the corner dealers keep checking the roofs.'],disc:['roofline','Roofline Activity','Lead']},'Explore':{text:['You find a fire escape route connecting three buildings without touching street level.','A boarded service corridor opens into a maze of back alleys.'],disc:['narrows-route','Narrows Rooftop Route','Location']},'Talk':{text:['A shop owner lowers his voice when you mention masked vigilantes: “They hear more than cops do.”','A teenager points toward the elevated tracks and says someone has been watching the gangs all week.'],disc:null},'Investigate':{text:['Fresh boot prints cross a roof access door. Heavy tread. Deliberate spacing.','Someone recently cut a padlock and replaced it with an identical new one.'],disc:['narrows-access','Compromised Roof Access','Intel']}}},docks:{name:'Gotham Docks',icon:'⚓︎',desc:'Cargo cranes loom through fog while black water knocks against steel pilings.',actions:{'Observe':{text:['One freighter sits dark while every ship around it runs deck lights.','A crane operator stops mid-lift, stares toward warehouse twelve, then resumes.'],disc:['dark-freighter','Unlit Freighter','Lead']},'Explore':{text:['You trace a service path behind stacked containers that bypasses the main gate.','A maintenance ladder gives clean access to the warehouse roofs.'],disc:['dock-route','Dock Service Route','Location']},'Investigate':{text:['A shipping seal has been broken and carefully glued back together.','Fresh scrape marks show a container was moved without appearing on the yard board.'],disc:['tampered-cargo','Tampered Cargo Seal','Evidence']},'Listen':{text:['Metal clanks inside an otherwise empty warehouse. Then silence.','Two dockworkers whisper about a shipment nobody was paid enough to ask about.'],disc:null}}},wayne:{name:'Wayne District',icon:'▰',desc:'Glass towers rise above older Gotham stone. Wayne Tower dominates the skyline.',actions:{'Observe':{text:['Wayne Tower security is discreet, layered, and much heavier than the lobby suggests.','A black executive car leaves the tower and merges into traffic without an escort.'],disc:['wayne-security','Wayne Tower Security Layers','System']},'Explore':{text:['Public walkways connect the corporate plaza, transit hub, and riverfront.','A pedestrian bridge gives a clear line of sight toward several downtown rooftops.'],disc:['wayne-plaza','Wayne Plaza','Location']},'Browse':{text:['A kiosk cycles through Wayne Foundation relief projects across Gotham.','Local news displays another argument over reconstruction funding.'],disc:null},'Investigate':{text:['Some roof-access cameras are newer than the rest of the building system. Much newer.','A service elevator has access restrictions that make no sense for ordinary maintenance.'],disc:['wayne-anomaly','Wayne Infrastructure Anomaly','Intel']}}}}},metropolis:{name:'Metropolis',subtitle:'Sunlit steel, impossible heights, and the sense that tomorrow arrived early.',theme:'metroGlow',locations:{planet:{name:'Daily Planet Plaza',icon:'◎',desc:'The globe crowns the skyline while reporters, commuters, and tourists flood the plaza.',actions:{'Observe':{text:['A red-blue streak crosses between buildings too quickly for anyone but you to track cleanly.','Half the plaza looks upward at once. By the time phones come out, the sky is empty.'],disc:['sky-streak','High-Speed Aerial Contact','Sighting']},'Explore':{text:['The plaza connects directly to transit, news offices, and several public observation routes.','A side street provides an excellent view of the Planet building without joining the crowd.'],disc:['planet-plaza','Daily Planet Plaza','Location']},'Talk':{text:['A street vendor says Superman sightings are “bad for sales, great for tips.”','A junior reporter asks whether you saw which direction the blur went.'],disc:null},'Investigate':{text:['Emergency crews here stage equipment differently than Gotham—built around sudden vertical threats.','Several rooftop cameras automatically tilt skyward when sirens begin.'],disc:['metro-response','Metropolis Vertical Response','System']}}},park:{name:'Centennial Park',icon:'✦',desc:'Open lawns and polished monuments sit beneath a skyline that seems impossibly clean.',actions:{'Observe':{text:['Children point upward as something glints high over the city.','A patrol drone quietly changes course toward downtown.'],disc:null},'Explore':{text:['A memorial path documents repeated citywide disasters—and equally repeated rebuilding.','You find a quiet overlook with an unobstructed view of downtown airspace.'],disc:['centennial-overlook','Centennial Overlook','Location']},'Talk':{text:['A groundskeeper shrugs at distant sirens. “If it gets serious, you’ll know.”','A tourist proudly lists three times Superman supposedly saved this exact park.'],disc:null},'Investigate':{text:['Reinforced utility access points are hidden beneath decorative landscaping.','The park emergency system includes underground shelters not shown on public maps.'],disc:['park-shelters','Centennial Emergency Shelters','Intel']}}},star:{name:'S.T.A.R. Labs Exterior',icon:'⬡',desc:'A secured research complex humming with clean power and very expensive secrets.',actions:{'Observe':{text:['Security uses overlapping human and automated patrol patterns.','A sealed transport arrives under escort and disappears below street level.'],disc:['star-security','S.T.A.R. Security Pattern','System']},'Explore':{text:['The public research wing is separated from the secure campus by multiple controlled zones.','A service road loops behind the campus and vanishes beneath an elevated rail line.'],disc:['star-campus','S.T.A.R. Labs Campus','Location']},'Talk':{text:['A researcher tells you the public tour is closed “because physics had a bad morning.”','A security officer is polite, professional, and absolutely unwilling to discuss the convoy.'],disc:null},'Investigate':{text:['The sealed transport radiates enough shielding to defeat ordinary scanners.','A loading bay briefly opens, revealing containment markings before the shutters close.'],disc:['star-containment','S.T.A.R. Containment Transfer','Lead']}}},southside:{name:'Southside',icon:'◇',desc:'Older blocks sit in the shadow of gleaming towers. Metropolis looks different at street level.',actions:{'Observe':{text:['A neighborhood watch group has better coordination than many formal patrols.','A distant boom makes everyone pause for exactly one second before life resumes.'],disc:null},'Explore':{text:['Murals mark community safe points, clinics, and rebuilt blocks.','An elevated rail platform gives quick access toward downtown without crossing the business district.'],disc:['southside-route','Southside Transit Route','Location']},'Talk':{text:['A mechanic tells you the neighborhood survives because people here watch out for each other.','A shop owner laughs at the skyline: “Pretty from here. Expensive up close.”'],disc:null},'Investigate':{text:['You find scorched pavement patched so recently the sealant is still bright.','A crushed streetlight has fingerprints in the metal far above normal reach.'],disc:['impact-trace','Recent Superhuman Impact Trace','Evidence']}}}}}};
function load(){try{return {...freshState(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return freshState()}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function addFeed(text){state.feed=[{t:Date.now(),text},...(state.feed||[])].slice(0,50)}function discover(d){if(!d)return false;const[id,title,type]=d;if((state.discoveries||[]).some(x=>x.id===id))return false;state.discoveries=[{id,title,type,t:Date.now()},...(state.discoveries||[])];return true}function toast(msg,good=false){const el=document.createElement('div');el.className='toast'+(good?' good':'');el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),1700)}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function topbar(label){return `<div class="topbar"><div class="brand"><small>Sovereign Archive · Demo</small><strong>${esc(label)}</strong></div><button class="iconbtn" data-act="journal" aria-label="Journal">☰</button>${state.screen!=='archive'?'<button class="iconbtn" data-act="archive" aria-label="Return to Archive">⌂</button>':''}</div>`}
function archiveScene(){return `<div class="scene archiveGlow"><svg viewBox="0 0 700 245" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><radialGradient id="a" cx="50%" cy="46%"><stop offset="0" stop-color="#5d55a8"/><stop offset=".35" stop-color="#191c3e"/><stop offset="1" stop-color="#080a12"/></radialGradient><linearGradient id="gold" x1="0" x2="1"><stop stop-color="#725f3c"/><stop offset=".5" stop-color="#e0c78c"/><stop offset="1" stop-color="#6b5736"/></linearGradient></defs><rect width="700" height="245" fill="url(#a)"/><g opacity=".45" fill="#080910"><rect x="0" y="45" width="155" height="200"/><rect x="545" y="45" width="155" height="200"/><g fill="#23263b"><rect x="18" y="63" width="9" height="150"/><rect x="45" y="68" width="9" height="150"/><rect x="72" y="63" width="9" height="150"/><rect x="99" y="68" width="9" height="150"/><rect x="126" y="63" width="9" height="150"/><rect x="575" y="68" width="9" height="150"/><rect x="600" y="63" width="9" height="150"/><rect x="625" y="68" width="9" height="150"/><rect x="650" y="63" width="9" height="150"/></g></g><g class="portalRing"><circle cx="350" cy="105" r="83" fill="none" stroke="url(#gold)" stroke-width="4" stroke-dasharray="8 10"/><circle cx="350" cy="105" r="70" fill="none" stroke="#8e7aff" stroke-opacity=".55" stroke-width="2" stroke-dasharray="3 12"/></g><ellipse cx="350" cy="108" rx="56" ry="76" fill="#6e63c7" opacity=".12"/><ellipse cx="350" cy="108" rx="44" ry="65" fill="#10142b" stroke="#c8a86d" stroke-opacity=".55" stroke-width="2"/><path d="M325 154 Q350 168 375 154" fill="none" stroke="#9a83ff" stroke-opacity=".6"/></svg><div class="sceneShade"></div><div class="sceneText"><div class="eyebrow">Extradimensional Hub</div><div class="sceneTitle">THE ARCHIVE</div><div class="sceneSub">Quiet shelves without end. One portal is awake.</div></div></div>`}
function gothamScene(title='GOTHAM CITY',sub=cityData.gotham.subtitle){let rain='';for(let i=0;i<32;i++)rain+=`<line x1="${(i*53)%700}" y1="${(i*31)%220}" x2="${(i*53)%700-6}" y2="${(i*31)%220+16}"/>`;return `<div class="scene gothamGlow"><svg viewBox="0 0 700 245" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="gsky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#13213c"/><stop offset="1" stop-color="#080b12"/></linearGradient></defs><rect width="700" height="245" fill="url(#gsky)"/><circle cx="570" cy="48" r="28" fill="#aabddc" opacity=".22"/><g fill="#0b0e15"><path d="M0 190V105h65v85h22V75h70v115h26V120h50v70h30V58h84v132h28V92h63v98h22V130h72v60h28V82h65v108h75v55H0z"/><path d="M302 58l3-23 4 23zm165 34l4-31 4 31z" fill="#080a10"/></g><g fill="#e1c678" opacity=".45"><rect x="107" y="96" width="7" height="4"/><rect x="126" y="116" width="7" height="4"/><rect x="289" y="87" width="7" height="4"/><rect x="319" y="116" width="7" height="4"/><rect x="482" y="129" width="7" height="4"/><rect x="614" y="105" width="7" height="4"/></g><g class="rain" stroke="#a9c6ee" stroke-opacity=".18" stroke-width="1">${rain}</g><path d="M0 205 Q180 185 350 210 T700 198V245H0z" fill="#07090e" opacity=".8"/></svg><div class="sceneShade"></div><div class="sceneText"><div class="eyebrow">DC Universe · East Coast</div><div class="sceneTitle">${esc(title)}</div><div class="sceneSub">${esc(sub)}</div></div></div>`}
function metroScene(title='METROPOLIS',sub=cityData.metropolis.subtitle){return `<div class="scene metroGlow"><svg viewBox="0 0 700 245" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="msky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#69a9d8"/><stop offset=".62" stop-color="#b9d9e6"/><stop offset="1" stop-color="#f0c96f"/></linearGradient><linearGradient id="glass" x1="0" x2="1"><stop stop-color="#315770"/><stop offset=".5" stop-color="#86b6cb"/><stop offset="1" stop-color="#27465d"/></linearGradient></defs><rect width="700" height="245" fill="url(#msky)"/><circle cx="104" cy="54" r="34" fill="#ffe5a4" opacity=".85"/><g fill="url(#glass)"><rect x="30" y="128" width="75" height="117" rx="3"/><rect x="120" y="82" width="95" height="163" rx="4"/><path d="M250 245V55h86v190z"/><rect x="370" y="105" width="80" height="140" rx="4"/><path d="M485 245V78h92v167z"/><rect x="598" y="122" width="72" height="123" rx="3"/></g><path d="M298 55v-29h-9l4-8h11l4 8h-8v29z" fill="#345267"/><ellipse cx="298" cy="17" rx="13" ry="5" fill="none" stroke="#e7f4f8" stroke-width="2"/><g fill="#fff" opacity=".48"><ellipse cx="500" cy="48" rx="48" ry="10"/><ellipse cx="542" cy="42" rx="30" ry="8"/></g></svg><div class="sceneShade"></div><div class="sceneText"><div class="eyebrow">DC Universe · East Coast</div><div class="sceneTitle">${esc(title)}</div><div class="sceneSub">${esc(sub)}</div></div></div>`}
function saveLine(){return `<div class="saveLine"><i></i> Autosave active · stored on this device</div>`}
function renderArchive(){return topbar('Archive · Core Chamber')+`<main class="main">${archiveScene()}<section class="section"><div class="sectionTitle"><h2>Archive Status</h2><span>Stable</span></div><div class="card"><div class="stats"><div class="stat"><b>1</b><span>Universe</span></div><div class="stat"><b>2</b><span>Cities</span></div><div class="stat"><b>${state.discoveries.length}</b><span>Finds</span></div></div>${saveLine()}</div></section><section class="section"><div class="sectionTitle"><h2>Available</h2><span>Tap to enter</span></div><div class="grid"><button class="choice" data-act="portal"><span class="pill"><span class="dot"></span>ONLINE</span><strong style="margin-top:10px">Portal Chamber</strong><p>Select an unlocked universe and destination.</p><span class="arrow">›</span></button><button class="choice" data-act="journal"><strong>Archive Index</strong><p>Review discoveries and recent activity.</p><span class="arrow">›</span></button><button class="choice locked" disabled><strong>Manifestation Vault</strong><p>Systems reserved for a later build.</p><span class="arrow">⌁</span></button></div></section></main>`}
function renderPortal(){return topbar('Archive · Portal Chamber')+`<main class="main">${archiveScene()}<section class="section"><div class="sectionTitle"><h2>Universe Index</h2><span>1 unlocked</span></div><div class="grid"><button class="choice" data-act="dc"><span class="pill"><span class="dot"></span>UNLOCKED</span><strong style="margin-top:10px">DC Universe</strong><p>Known access points: Gotham City, Metropolis.</p><span class="arrow">›</span></button><button class="choice locked" disabled><strong>Unknown Universe</strong><p>No stable anchor.</p><span class="arrow">⌁</span></button><button class="choice locked" disabled><strong>Unknown Universe</strong><p>No stable anchor.</p><span class="arrow">⌁</span></button></div></section><section class="section"><button class="secondary" data-act="archive">Return to Archive</button></section></main>`}
function renderDC(){return topbar('Portal · DC Universe')+`<main class="main"><div class="card" style="padding:14px"><div class="eyebrow">Universe Selected</div><div style="font-size:28px;font-weight:900;margin-top:4px">DC UNIVERSE</div><p style="color:var(--muted);font-size:12px;margin:7px 0 0">Choose a stable city anchor. Both are open immediately.</p></div><section class="section"><div class="sectionTitle"><h2>Destinations</h2><span>2 stable anchors</span></div><div class="grid"><button class="choice" data-city="gotham" style="min-height:124px;background:linear-gradient(135deg,#17243c,#0b0f17)"><span class="pill">GOTHAM</span><strong style="margin-top:10px;font-size:22px">Gotham City</strong><p>Rain-soaked streets, dense crime networks, vigilant rooftops.</p><span class="arrow">›</span></button><button class="choice" data-city="metropolis" style="min-height:124px;background:linear-gradient(135deg,#385f78,#8a7244)"><span class="pill">METROPOLIS</span><strong style="margin-top:10px;font-size:22px">Metropolis</strong><p>Bright towers, advanced science, superhuman activity.</p><span class="arrow">›</span></button></div></section><section class="section"><button class="secondary" data-act="portal">Back to Universe Index</button></section></main>`}
function renderCity(cityKey){const c=cityData[cityKey],scene=cityKey==='gotham'?gothamScene():metroScene();return topbar(`DC · ${c.name}`)+`<main class="main">${scene}<section class="section"><div class="sectionTitle"><h2>City Network</h2><span>${Object.keys(c.locations).length} accessible</span></div><div class="grid">${Object.entries(c.locations).map(([k,l])=>`<button class="choice locationCard" data-location="${k}"><span class="locIcon">${l.icon}</span><span class="meta"><strong>${esc(l.name)}</strong><span>${esc(l.desc)}</span></span><span class="arrow">›</span></button>`).join('')}</div></section><section class="section"><div class="grid two"><button class="secondary" data-act="dc">Change City</button><button class="secondary" data-act="archive">Return to Archive</button></div></section></main>`}
function renderLocation(cityKey,locKey){const c=cityData[cityKey],l=c.locations[locKey],scene=cityKey==='gotham'?gothamScene(l.name.toUpperCase(),l.desc):metroScene(l.name.toUpperCase(),l.desc);return topbar(`DC · ${c.name} · ${l.name}`)+`<main class="main">${scene}<section class="section"><div class="sectionTitle"><h2>Situation</h2><span>Free exploration</span></div><div class="card"><p style="margin:0;color:#d8ddea;font-size:13px;line-height:1.5">${esc(l.desc)}</p>${state.lastResult?`<div style="height:10px"></div><div class="result">${esc(state.lastResult)}</div>`:''}</div></section><section class="section"><div class="sectionTitle"><h2>Actions</h2><span>Tap to act</span></div><div class="actions">${Object.keys(l.actions).map(a=>`<button class="action" data-do="${esc(a)}">${esc(a)}</button>`).join('')}</div></section><section class="section"><div class="grid two"><button class="secondary" data-act="city">City Map</button><button class="secondary" data-act="archive">Return to Archive</button></div></section></main>`}
function renderJournal(){const discoveries=state.discoveries||[],feed=state.feed||[];return `<div class="overlay"><div class="sheet"><div class="sheetHead"><div><div class="eyebrow">Persistent Record</div><h2>Archive Index</h2></div><button class="close" data-act="close">×</button></div><div class="stats"><div class="stat"><b>${discoveries.length}</b><span>Discoveries</span></div><div class="stat"><b>${Object.keys(state.visits||{}).length}</b><span>Places</span></div><div class="stat"><b>${feed.length}</b><span>Events</span></div></div><hr><div class="sectionTitle"><h2>Discoveries</h2><span>${discoveries.length}</span></div>${discoveries.length?discoveries.map(d=>`<div class="logItem"><span class="tag">${esc(d.type)}</span><strong>${esc(d.title)}</strong></div>`).join(''):'<div class="logItem"><p>No field discoveries yet. Enter the portal and explore.</p></div>'}<hr><div class="sectionTitle"><h2>Recent Activity</h2><span>Latest first</span></div>${feed.map(f=>`<div class="logItem"><strong>${esc(f.text)}</strong><p>${new Date(f.t).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</p></div>`).join('')}<hr><button class="secondary" data-act="settings">Settings</button></div></div>`}
function renderSettings(){return `<div class="overlay"><div class="sheet"><div class="sheetHead"><div><div class="eyebrow">Demo Controls</div><h2>Settings</h2></div><button class="close" data-act="close">×</button></div><div class="card"><strong>Local Save</strong><p style="color:var(--muted);font-size:12px;line-height:1.5;margin-bottom:0">Progress is stored in this browser on this device. Refreshing or reopening the game returns you to your latest location.</p></div><div style="height:10px"></div><button class="secondary" data-act="reset" style="border-color:rgba(255,109,122,.3);color:#ff9ba4">Reset Demo Save</button></div></div>`}
function render(){document.body.className=state.city?cityData[state.city].theme:'archiveGlow';let h='';if(state.screen==='archive')h=renderArchive();else if(state.screen==='portal')h=renderPortal();else if(state.screen==='dc')h=renderDC();else if(state.screen==='city')h=renderCity(state.city||'gotham');else if(state.screen==='location')h=renderLocation(state.city||'gotham',state.location||'central');else h=renderArchive();app.innerHTML=h;bind()}
function performAction(name){const l=cityData[state.city].locations[state.location],spec=l.actions[name],key=`${state.city}:${state.location}:${name}`,n=state.actionCounts[key]||0,text=Array.isArray(spec.text)?spec.text[n%spec.text.length]:spec.text;state.actionCounts[key]=n+1;state.lastResult=text;const fresh=discover(spec.disc);addFeed(`${l.name}: ${name}.`);save();render();if(fresh)toast(`Discovery added: ${spec.disc[1]}`,true)}
function navigate(a){if(a==='archive'){state.screen='archive';state.universe=null;state.city=null;state.location=null;state.lastResult='';addFeed('Returned to the Archive.')}if(a==='portal'){state.screen='portal';state.city=null;state.location=null;state.lastResult='';addFeed('Entered the Portal Chamber.')}if(a==='dc'){state.screen='dc';state.universe='dc';state.city=null;state.location=null;state.lastResult='';addFeed('Selected the DC Universe.')}if(a==='city'){state.screen='city';state.location=null;state.lastResult=''}save();render()}
function bind(){app.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.act;if(a==='journal'){document.body.insertAdjacentHTML('beforeend',renderJournal());bindOverlay();return}navigate(a)}));app.querySelectorAll('[data-city]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.city;state.screen='city';state.universe='dc';state.city=k;state.location=null;state.lastResult='';state.visits[k]=(state.visits[k]||0)+1;discover([`city-${k}`,cityData[k].name,'City']);addFeed(`Arrived in ${cityData[k].name}.`);save();render();toast(`${cityData[k].name} anchor established.`,true)}));app.querySelectorAll('[data-location]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.location,l=cityData[state.city].locations[k];state.screen='location';state.location=k;state.lastResult='';state.visits[`${state.city}:${k}`]=(state.visits[`${state.city}:${k}`]||0)+1;discover([`loc-${state.city}-${k}`,l.name,'Location']);addFeed(`Entered ${l.name}.`);save();render()}));app.querySelectorAll('[data-do]').forEach(b=>b.addEventListener('click',()=>performAction(b.dataset.do)))}
function bindOverlay(){document.querySelectorAll('.overlay [data-act]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const a=b.dataset.act;if(a==='close')b.closest('.overlay').remove();else if(a==='settings'){b.closest('.overlay').outerHTML=renderSettings();bindOverlay()}else if(a==='reset'&&confirm('Reset all demo progress on this device?')){localStorage.removeItem(KEY);state=freshState();document.querySelector('.overlay')?.remove();render();toast('Demo save reset.')}}));document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.remove()}))}
render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
