<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="Pilgrim House scene, hand-built illustrated medieval fantasy environment">
<defs>
<linearGradient id="sky" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#0c1a29"/><stop offset=".53" stop-color="#253149"/><stop offset="1" stop-color="#604235"/></linearGradient>
<linearGradient id="stone" x1="0" x2="1" y1="0" y2=".2"><stop stop-color="#6b5b4b"/><stop offset=".34" stop-color="#33333a"/><stop offset="1" stop-color="#171f2c"/></linearGradient>
<linearGradient id="slate" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#485267"/><stop offset=".55" stop-color="#1c2a3c"/><stop offset="1" stop-color="#0c1928"/></linearGradient>
<linearGradient id="timber" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#89623e"/><stop offset=".44" stop-color="#493322"/><stop offset="1" stop-color="#21171a"/></linearGradient>
<linearGradient id="metal" x1="0" x2="1"><stop stop-color="#161f2c"/><stop offset=".27" stop-color="#82919b"/><stop offset=".51" stop-color="#2b3540"/><stop offset=".83" stop-color="#b3a087"/><stop offset="1" stop-color="#252b31"/></linearGradient>
<linearGradient id="parch" x1="0" x2=".8" y1="0" y2="1"><stop stop-color="#d5bf8d"/><stop offset=".47" stop-color="#c3a878"/><stop offset="1" stop-color="#806c50"/></linearGradient>
<linearGradient id="banner" x1="0" x2=".7" y1="0" y2="1"><stop stop-color="#2c5574"/><stop offset=".57" stop-color="#183047"/><stop offset="1" stop-color="#111e30"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#ffc976" stop-opacity=".83"/><stop offset=".27" stop-color="#ef9b40" stop-opacity=".35"/><stop offset="1" stop-color="#dc7323" stop-opacity="0"/></radialGradient>
<radialGradient id="mist"><stop stop-color="#99b8c2" stop-opacity=".23"/><stop offset="1" stop-color="#708b9a" stop-opacity="0"/></radialGradient>
<pattern id="masonry" width="100" height="55" patternUnits="userSpaceOnUse"><path d="M0 54H100M42 0V54" fill="none" stroke="#b8a187" stroke-width="1" opacity=".12"/><path d="M0 7H100" stroke="#141b25" opacity=".22"/></pattern>
<pattern id="grain" width="85" height="80" patternUnits="userSpaceOnUse"><path d="M8 13l26-4 21 6M6 45l35 4 33-2M34 75l28-8" fill="none" stroke="#19191c" stroke-width="1.1" opacity=".12"/></pattern>
<filter id="blur"><feGaussianBlur stdDeviation="7"/></filter>
<filter id="tinyblur"><feGaussianBlur stdDeviation="2"/></filter>
<style>
.fire{transform-origin:50% 100%;animation:flicker 1.9s ease-in-out infinite alternate}.fire.alt{animation-delay:-.8s;animation-duration:2.5s}
.flag{animation:wave 5.5s ease-in-out infinite alternate}.glint{animation:glimmer 4.4s ease-in-out infinite alternate}
.drift{animation:float 8.4s ease-in-out infinite alternate}.drift.alt{animation-delay:-3s;animation-duration:11s}
@keyframes flicker{0%{transform:scale(.9,.93);opacity:.74}70%{transform:scale(1.05,1.07);opacity:1}100%{transform:scale(.96,1);opacity:.85}}
@keyframes wave{from{transform:skewX(-.7deg)}to{transform:skewX(1.1deg)}}
@keyframes glimmer{0%,100%{opacity:.38}55%{opacity:1}}
@keyframes float{from{transform:translate(0,0);opacity:.25}to{transform:translate(12px,-18px);opacity:.67}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
