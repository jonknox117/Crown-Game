<linearGradient id="timber" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#89623e"/><stop offset=".44" stop-color="#493322"/><stop offset="1" stop-color="#21171a"/></linearGradient>
<linearGradient id="metal" x1="0" x2="1"><stop stop-color="#161f2c"/><stop offset=".27" stop-color="#82919b"/><stop offset=".51" stop-color="#2b3540"/><stop offset=".83" stop-color="#b3a087"/><stop offset="1" stop-color="#252b31"/></linearGradient>
