@keyframes wave{from{opacity:.87}to{opacity:1}}
@keyframes glimmer{0%,100%{opacity:.38}55%{opacity:1}}
@keyframes float{from{transform:translate(0,0);opacity:.25}to{transform:translate(12px,-18px);opacity:.67}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
